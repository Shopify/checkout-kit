buildscript {
  def getKotlinVersion = {
    if (rootProject.ext.has("kotlinVersion")) {
      return rootProject.ext.get("kotlinVersion")
    }
    if (rootProject.ext.has("kotlin_version")) {
      return rootProject.ext.get("kotlin_version")
    }
    if (rootProject.hasProperty("kotlinVersion")) {
      return rootProject.property("kotlinVersion")
    }
    if (rootProject.hasProperty("kotlin_version")) {
      return rootProject.property("kotlin_version")
    }
    return "2.0.21"
  }

  ext.kotlin_version = getKotlinVersion()

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.11.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
  }
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.serialization"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties[name]).toInteger()
}

static def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

buildToolsVersion = "35.0.0"
minSdkVersion = 24
compileSdkVersion = 36
targetSdkVersion = 35

// We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
ndkVersion = "23.1.7779620"

android {
  if (supportsNamespace()) {
    namespace "com.shopify.reactnative.checkoutkit"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

  }

  buildTypes {
    debug {
      minifyEnabled false
    }

    release {
      minifyEnabled false

      // Rules in consumerProguardFiles are automatically included in the ProGuard configuration of any application that uses the library
      consumerProguardFiles 'proguard-rules.pro'
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  kotlinOptions {
    jvmTarget = "1.8"
  }

  testOptions {
    unitTests.includeAndroidResources = true
  }
}


def packageJsonFile = file("../package.json")
def packageJson = new groovy.json.JsonSlurper().parse(packageJsonFile)
def shopifySdkVersion = packageJson.checkoutKit?.nativeSdkVersions?.android as String

if (shopifySdkVersion == null || shopifySdkVersion.trim().isEmpty()) {
  throw new GradleException("checkoutKit.nativeSdkVersions.android is required in ${packageJsonFile}")
}

def shopifySdkArtifact = "com.shopify:checkout-kit:$shopifySdkVersion"

repositories {
  mavenCentral()
  google()
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  // Uncomment to install dependencies for local development
  //  implementation("com.facebook.react:react-android:+")

  implementation(shopifySdkArtifact)
  implementation("com.fasterxml.jackson.core:jackson-databind:2.12.5")
  implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")
  debugImplementation(shopifySdkArtifact)

  testImplementation "junit:junit:4.13.2"
  testImplementation "org.assertj:assertj-core:3.27.7"
  testImplementation "org.robolectric:robolectric:4.16.1"
}

tasks.withType(Test).configureEach {
  inputs.file("../src/errors.ts")
    .withPropertyName("checkoutErrorCodeWireFormat")
    .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file("../scripts/print-error-codes.mjs")
    .withPropertyName("checkoutErrorCodeExporter")
    .withPathSensitivity(PathSensitivity.RELATIVE)
}
