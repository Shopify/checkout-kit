// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
      classpath("com.android.tools.build:gradle")
      classpath("com.facebook.react:react-native-gradle-plugin")
      classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

def loadProperties() {
    def props = new Properties()
    file('../.env').withInputStream {
        props.load(it)
    }
    return props
}

apply plugin: "com.facebook.react.rootproject"

def useLocalSdk = (System.getenv("USE_LOCAL_SDK") ?: "0") == "1"

if (useLocalSdk && System.getenv("CI") != null) {
    throw new GradleException(
        "USE_LOCAL_SDK=1 is set in CI. CI must resolve the published native SDKs, " +
        "so this build would not match what merges. Unset USE_LOCAL_SDK."
    )
}

allprojects {
    repositories {
        if (useLocalSdk) {
            exclusiveContent {
                forRepository {
                    mavenLocal()
                }
                filter {
                    includeModule("com.shopify", "embedded-checkout-protocol")
                    includeModule("com.shopify", "checkout-kit")
                }
            }
        }
        google()
        mavenCentral()
    }
}

// Configure memory for forked test JVMs to avoid OOMs in CI
subprojects {
    tasks.withType(Test).configureEach {
        maxHeapSize = "1536m"
        jvmArgs "-XX:MaxMetaspaceSize=512m"
    }
}
