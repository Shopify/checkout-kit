name: ShopifyAcceleratedCheckoutsApp
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "16.6"
  xcodeVersion: "26.2"
  projectFormat: xcode16_0
packages:
  ShopifyCheckoutKit:
    path: ../../../..
  Apollo:
    url: https://github.com/apollographql/apollo-ios.git
    from: 2.0.0
configs:
  Debug: debug
  Release: release
schemes:
  ShopifyAcceleratedCheckoutsApp:
    build:
      targets:
        ShopifyAcceleratedCheckoutsApp: all
    run:
      config: Debug
      language: en
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
      orderHint: 3

targets:
  ShopifyAcceleratedCheckoutsApp:
    type: application
    platform: iOS
    sources:
      - path: ShopifyAcceleratedCheckoutsApp
        type: syncedFolder
        excludes:
          - Info.plist
    configFiles:
      Debug: Storefront.xcconfig
      Release: Storefront.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shopify.example.ShopifyAcceleratedCheckoutsApp
        DEVELOPMENT_TEAM: A7XGC83MZE
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        DEVELOPMENT_ASSET_PATHS: '"ShopifyAcceleratedCheckoutsApp/Preview Content"'
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Accelerated Checkouts
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    dependencies:
      - package: Apollo
        product: Apollo
      - package: ShopifyCheckoutKit
        product: ShopifyAcceleratedCheckouts
    info:
      path: ShopifyAcceleratedCheckoutsApp/Info.plist
      properties:
        STOREFRONT_ACCESS_TOKEN: $(STOREFRONT_ACCESS_TOKEN)
        STOREFRONT_DOMAIN: $(STOREFRONT_DOMAIN)
        API_VERSION: $(API_VERSION)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ShopifyAcceleratedCheckoutsApp/ShopifyAcceleratedCheckoutsApp.entitlements
      properties: {}
