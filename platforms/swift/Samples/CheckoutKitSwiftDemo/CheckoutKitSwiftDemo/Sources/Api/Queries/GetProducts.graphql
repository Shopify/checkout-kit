query GetProducts($first: Int = 50, $after: String, $country: CountryCode!, $language: LanguageCode!) @inContext(country: $country, language: $language) {
  products(first: $first, after: $after, sortKey: CREATED_AT, reverse: true) {
    nodes {
      id
      title
      handle
      description
      vendor
      requiresSellingPlan
      featuredImage {
        url
      }
      collections(first: 1) {
        nodes {
          id
          title
        }
      }
      variants(first: 1) {
        nodes {
          id
          title
          availableForSale
          sellingPlanAllocations(first: 10) {
            nodes {
              sellingPlan {
                id
                name
              }
            }
          }
          price {
            amount
            currencyCode
          }
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
