import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        if (providers.gradleProperty('usePublishedProtocol').getOrElse('false').toBoolean()) {
            exclusiveContent {
                forRepository { mavenCentral() }
                filter { includeModule('com.shopify', 'embedded-checkout-protocol') }
            }
        }
    }
}
rootProject.name = "checkout-kit"

// Release builds must not compile the in-repo protocol instead of its Maven artifact.
if (!providers.gradleProperty('usePublishedProtocol').getOrElse('false').toBoolean()) {
    include ':embedded-checkout-protocol'
    project(':embedded-checkout-protocol').projectDir = file('../../protocol/languages/kotlin/embedded-checkout-protocol')
}
include ':lib'
