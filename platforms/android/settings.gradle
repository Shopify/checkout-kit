import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "checkout-kit"

if (providers.gradleProperty('useLocalProtocol').getOrElse('false').toBoolean()) {
    include ':embedded-checkout-protocol'
    project(':embedded-checkout-protocol').projectDir = file('../../protocol/languages/kotlin/embedded-checkout-protocol')
}
include ':lib'

if (providers.gradleProperty('appSizeBenchmark').getOrElse('false').toBoolean()) {
    include ':app-size-benchmark'
    project(':app-size-benchmark').projectDir = file('benchmarks/app-size')
}
