// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'signing'
    alias(libs.plugins.android.fused.library) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.serialization) apply false
    alias(libs.plugins.detekt) apply false
    alias(libs.plugins.binary.compatibility.validator)
}

// The fused plugin provides assemble rather than the standard build lifecycle.
tasks.named('build') { dependsOn ':shopify-checkout-kit:assemble' }

// BuildConfig is generated implementation detail, not a merchant SDK contract.
apiValidation {
    ignoredClasses += 'com.shopify.checkoutkit.checkout.BuildConfig'
}
