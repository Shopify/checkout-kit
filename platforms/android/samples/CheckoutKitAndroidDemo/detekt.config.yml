# The sample enforces Detekt's default rules with targeted opt-outs for existing sample debt.
# Compose UI and JUnit test functions use idiomatic PascalCase and descriptive backticked names.
complexity:
  CyclomaticComplexMethod:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated: [ 'Composable', 'Test' ]
  MatchingDeclarationName:
    active: true

style:
  MagicNumber:
    # A named property documents the meaning of a value; retain the check for inline literals.
    ignorePropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  UnusedParameter:
    active: true
  UseRequire:
    active: true

formatting:
  active: true
  Filename:
    active: true
  autoCorrect: true
  MaximumLineLength:
    active: true
    maxLineLength: 140
  NoUnusedImports:
    active: true
  NoWildcardImports:
    active: true
