plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.apollographql.apollo'
}

import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

def loadProperties() {
    def props = new Properties()
    file('../.env').withInputStream {
        props.load(it)
    }
    return props
}

def properties = loadProperties()

def propertyOrDefault = { String key, String defaultValue ->
    def value = properties.getProperty(key)
    return value?.trim() ? value.trim() : defaultValue
}

// Storefront API
def storefrontDomain = properties.getProperty("STOREFRONT_DOMAIN")
def accessToken = properties.getProperty("STOREFRONT_ACCESS_TOKEN")
def apiVersion = properties.getProperty("API_VERSION", "2026-04")

// Customer Account API
def customerAccountApiClientId = properties.getProperty("CUSTOMER_ACCOUNT_API_CLIENT_ID")
def customerAccountApiShopId = properties.getProperty("CUSTOMER_ACCOUNT_API_SHOP_ID")
def customerAccountApiVersion = propertyOrDefault("CUSTOMER_ACCOUNT_API_VERSION", "unstable")
def customerAccountApiRedirectUri = properties.getProperty("CUSTOMER_ACCOUNT_API_REDIRECT_URI")

def customerAccountApiGraphQLBaseUrl = properties.getProperty("CUSTOMER_ACCOUNT_API_GRAPHQL_BASE_URL")
def customerAccountApiAuthBaseUrl = properties.getProperty("CUSTOMER_ACCOUNT_API_AUTH_BASE_URL")

// User agent suffix the customer account login web view appends. Empty outside CI.
def customUserAgent = propertyOrDefault("CUSTOM_USER_AGENT", "")

if (!customerAccountApiRedirectUri && customerAccountApiShopId) {
    customerAccountApiRedirectUri = "shop.${customerAccountApiShopId}.app://callback"
}

if (!customerAccountApiGraphQLBaseUrl && customerAccountApiShopId) {
    customerAccountApiGraphQLBaseUrl = "https://shopify.com/${customerAccountApiShopId}/account/customer/api/${customerAccountApiVersion}/graphql"
}

if (!customerAccountApiAuthBaseUrl && customerAccountApiShopId) {
    customerAccountApiAuthBaseUrl = "https://shopify.com/authentication/${customerAccountApiShopId}"
}

// Demo buyer identity (prefill toggle in Settings)
def prefillEmail = properties.getProperty("EMAIL", properties.getProperty("PREFILL_EMAIL", "test.buyer@example.com"))
def prefillPhone = properties.getProperty("PHONE", properties.getProperty("PREFILL_PHONE", "+14165550100"))
def prefillFirstName = propertyOrDefault("FIRST_NAME", "Evelyn")
def prefillLastName = propertyOrDefault("LAST_NAME", "Hartley")
def prefillAddress1 = propertyOrDefault("ADDRESS_1", "650 King Street")
def prefillAddress2 = propertyOrDefault("ADDRESS_2", "Shopify HQ")
def prefillCompany = propertyOrDefault("COMPANY", "Shopify")
def prefillCity = propertyOrDefault("CITY", "Toronto")
def prefillProvince = propertyOrDefault("PROVINCE", "ON")
def prefillZip = propertyOrDefault("ZIP", "M5V 1M7")
def prefillCountry = propertyOrDefault("COUNTRY", "CA")

if (!storefrontDomain || !accessToken) {
    println("**** Please add a .env file with STOREFRONT_DOMAIN and STOREFRONT_ACCESS_TOKEN set *****")
}

android {
    namespace = 'com.shopify.checkout_kit_android_demo'
    compileSdk = 37

    defaultConfig {
        applicationId "com.shopify.checkoutkit.androiddemo"
        minSdk = 28
        targetSdk = 36
        versionCode = 34
        versionName = "0.0.${versionCode}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
        buildConfigField "String", "storefrontDomain", "\"$storefrontDomain\""
        buildConfigField "String", "storefrontAccessToken", "\"$accessToken\""
        buildConfigField "String", "storefrontApiVersion", "\"$apiVersion\""
        buildConfigField "String", "customerAccountApiClientId", "\"$customerAccountApiClientId\""
        buildConfigField "String", "customerAccountApiRedirectUri", "\"$customerAccountApiRedirectUri\""
        buildConfigField "String", "customerAccountApiAuthBaseUrl", "\"$customerAccountApiAuthBaseUrl\""
        buildConfigField "String", "customerAccountApiGraphQLBaseUrl", "\"$customerAccountApiGraphQLBaseUrl\""
        buildConfigField "String", "customUserAgent", "\"$customUserAgent\""
        buildConfigField "String", "prefillEmail", "\"$prefillEmail\""
        buildConfigField "String", "prefillPhone", "\"$prefillPhone\""
        buildConfigField "String", "prefillFirstName", "\"$prefillFirstName\""
        buildConfigField "String", "prefillLastName", "\"$prefillLastName\""
        buildConfigField "String", "prefillAddress1", "\"$prefillAddress1\""
        buildConfigField "String", "prefillAddress2", "\"$prefillAddress2\""
        buildConfigField "String", "prefillCompany", "\"$prefillCompany\""
        buildConfigField "String", "prefillCity", "\"$prefillCity\""
        buildConfigField "String", "prefillProvince", "\"$prefillProvince\""
        buildConfigField "String", "prefillZip", "\"$prefillZip\""
        buildConfigField "String", "prefillCountry", "\"$prefillCountry\""
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable = true
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    sourceSets {
        // Exposes the real backup rules to TokenBackupRulesTest rather than copies.
        test.resources.srcDir 'src/main/res/xml'
    }
}

tasks.withType(KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}


dependencies {
    // Checkout Kit
    implementation project(':lib')

    implementation libs.androidx.appcompat
    implementation libs.androidx.browser
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.datastore.preferences
    implementation libs.koin.androidx.compose
    implementation libs.androidx.room.runtime
    implementation libs.androidx.compose.material3
    implementation libs.androidx.paging.compose

    annotationProcessor libs.androidx.room.compiler
    ksp libs.androidx.room.compiler

    // Apollo GraphQL client for the Shopify Storefront API
    implementation libs.apollo.runtime
    implementation libs.apollo.cache.normalized

    // Image loading library
    implementation libs.coil.compose

    // Logging
    implementation libs.timber

    // Encrypts Customer Account access tokens with an Android Keystore-wrapped keyset.
    implementation libs.tink.android

    // Serialization
    implementation libs.kotlinx.serialization.json.demo

    testImplementation libs.junit
    testImplementation libs.assertj.core

    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}

apollo {
    service("storefront") {
        packageName.set("com.shopify.checkout_kit_android_demo.graphql")
        srcDir("src/main/graphql")
        plugin("com.apollographql.cache:normalized-cache-apollo-compiler-plugin:${libs.versions.apolloCache.get()}")
        pluginArgument("com.apollographql.cache.packageName", packageName.get())
    }
}
