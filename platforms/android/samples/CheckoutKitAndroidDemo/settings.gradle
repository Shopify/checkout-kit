import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(files('../../gradle/libs.versions.toml'))
        }
    }
}
rootProject.name = "CheckoutKitAndroidDemo"
include ':app'
include ':embedded-checkout-protocol'
include ':lib'
project(':embedded-checkout-protocol').projectDir = new File(settingsDir, '../../../../protocol/languages/kotlin/embedded-checkout-protocol')
project(':lib').projectDir = new File(settingsDir, '../../lib')
