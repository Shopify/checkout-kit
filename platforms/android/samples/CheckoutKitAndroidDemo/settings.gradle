import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(files('../../gradle/libs.versions.toml'))
        }
    }
}
rootProject.name = "CheckoutKitAndroidDemo"
include ':app'
include ':shopify-checkout-kit'
if (providers.gradleProperty('useLocalProtocol').getOrElse('false').toBoolean()) {
    include ':embedded-checkout-protocol'
    project(':embedded-checkout-protocol').projectDir = new File(settingsDir, '../../../../protocols/universal-commerce-protocol/embedded-checkout-protocol/languages/kotlin/embedded-checkout-protocol')
}
project(':shopify-checkout-kit').projectDir = new File(settingsDir, '../../shopify-checkout-kit')
