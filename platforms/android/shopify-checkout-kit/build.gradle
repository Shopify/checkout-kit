import org.gradle.api.publish.maven.tasks.PublishToMavenRepository

plugins {
    id 'shopify.checkout-kit-publication'
}

def versionName = libs.versions.checkoutKitAndroid.get()
def useLocalProtocol = providers.gradleProperty('useLocalProtocol').getOrElse('false').toBoolean()

androidFusedLibrary {
    namespace = 'com.shopify.checkoutkit'
    minSdk { version = release(23) }
    aarMetadata { minCompileSdk = 35 }
}

// Include each internal feature explicitly. External dependencies (including
// the independently published protocol) remain dependencies of the final AAR.
dependencies {
    include project(':shopify-checkout')
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn ':shopify-checkout:verifyPublishedProtocol'
    doFirst {
        if (useLocalProtocol) {
            throw new GradleException('Cannot publish Checkout Kit with useLocalProtocol=true. Build against the published protocol first.')
        }
    }
}

// Fused runtime metadata uses project coordinates. Explicit local protocol mode
// must resolve to the same Maven coordinate that publishToMavenLocal produces.
if (useLocalProtocol) {
    project(':embedded-checkout-protocol') {
        group = 'com.shopify'
        version = libs.versions.embeddedCheckoutProtocolAndroidRelease.get()
    }
}

// Coordinates and merchant-facing metadata belong to the SDK, not build logic.
publishing.publications.release {
    pom {
        name = "CheckoutKit"
        description = "Shopify's Checkout Kit makes it simple to render checkouts inside your mobile app."
        url = "https://github.com/Shopify/checkout-kit"
        groupId = "com.shopify"
        artifactId = "checkout-kit"
        version = versionName

        licenses {
            license {
                name = "MIT"
                url = "https://opensource.org/licenses/MIT"
            }
        }

        developers {
            developer {
                name = "Shopify Inc."
            }
        }

        scm {
            connection = "https://github.com/Shopify/checkout-kit.git"
            developerConnection = "https://github.com/Shopify/checkout-kit.git"
            url = "https://github.com/Shopify/checkout-kit.git"
        }
    }
}
