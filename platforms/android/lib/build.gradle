import io.gitlab.arturbosch.detekt.Detekt
import org.gradle.api.file.FileCollection
import org.gradle.api.tasks.Classpath
import org.gradle.process.CommandLineArgumentProvider
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion
import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

plugins {
    id 'signing'
    id 'maven-publish'
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'io.gitlab.arturbosch.detekt'
}

apply from: file('../gradle/android-library-versions.gradle')

def kotlinCompatibility = kotlinVersionCompatibility
def versionName = libs.versions.checkoutKitAndroid.get()

class MockitoAgentArgumentProvider implements CommandLineArgumentProvider {
    @Classpath
    final FileCollection classpath

    MockitoAgentArgumentProvider(FileCollection classpath) {
        this.classpath = classpath
    }

    @Override
    Iterable<String> asArguments() {
        ["-javaagent:${classpath.singleFile.absolutePath}".toString()]
    }
}

configurations {
    mockitoAgent {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

android {
    namespace = 'com.shopify.checkoutkit'
    compileSdk = 36

    defaultConfig {
        minSdk = 23
        versionCode = 1
        versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SDK_VERSION", "\"$versionName\""

        aarMetadata {
            minCompileSdk = 35
        }
    }

    lint {
        checkDependencies = true
        warningsAsErrors = true
        disable 'GradleDependency', 'NewerVersionAvailable', 'SimilarGradleDependency'
        warning 'LintBaseline'
        informational 'AndroidGradlePluginVersion'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            consumerProguardFiles 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.toVersion(kotlinCompatibility.javaVersion)
        targetCompatibility JavaVersion.toVersion(kotlinCompatibility.javaVersion)
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgumentProviders.add(new MockitoAgentArgumentProvider(configurations.mockitoAgent))
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
    buildFeatures {
        buildConfig = true
    }
}

tasks.withType(KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget.set(JvmTarget.valueOf(kotlinCompatibility.kotlinJvmTarget))
        // Pin language/API version so bytecode stays consumable by Kotlin 2.0+ consumers
        // even though the compiler is on a newer 2.x. Kotlin 1.9 is deprecated by the 2.x
        // compiler, so 2.0 is the lowest pin we can hold without taking deprecation warnings;
        // keeping the compiler ahead of the pin leaves room to bump kotlinc without re-breaking
        // consumers.
        apiVersion.set(KotlinVersion.valueOf(kotlinCompatibility.kotlinApiVersion))
        languageVersion.set(KotlinVersion.valueOf(kotlinCompatibility.kotlinLanguageVersion))
        if (!name.contains("Test")) {
            freeCompilerArgs.add("-Xexplicit-api=strict")
        }
    }
}

dependencies {
    detektPlugins libs.detekt.formatting
    mockitoAgent libs.mockito.core

    api project(':embedded-checkout-protocol')

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.mockito.android
    testImplementation libs.assertj.core
    testImplementation libs.awaitility

    androidTestImplementation libs.androidx.test.core.ktx
    androidTestImplementation libs.androidx.test.ext.junit.ktx

    // Keep the published stdlib dependency aligned with the Kotlin API/language
    // consumer floor, not the newer compiler used to build the AAR.
    implementation libs.kotlin.stdlib

    //Implementation
    implementation libs.kotlinx.serialization.json
    implementation libs.androidx.appcompat
    implementation libs.androidx.webkit
}

signing {
    def signingKeyId = findProperty("signingKeyId")
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    if (signingKey) {
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
        sign publishing.publications
    }
}

detekt {
    buildUponDefaultConfig = true
    config.setFrom('detekt.config.yml')
    autoCorrect = true
}

// Models.kt is generated from UCP JSON Schemas — exclude it from static analysis.
tasks.withType(Detekt).configureEach {
    exclude('**/Models.kt')
}


project.afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                pom {
                    name = "CheckoutKit"
                    description = "Shopify's Checkout Kit makes it simple to render checkouts inside your mobile app."
                    url = "https://github.com/Shopify/checkout-kit"
                    groupId = "com.shopify"
                    artifactId = "checkout-kit"
                    version = versionName

                    licenses {
                        license {
                            name = "MIT"
                            url = "https://opensource.org/licenses/MIT"
                        }
                    }

                    developers {
                        developer {
                            name = "Shopify Inc."
                        }
                    }

                    scm {
                        connection = "https://github.com/Shopify/checkout-kit.git"
                        developerConnection = "https://github.com/Shopify/checkout-kit.git"
                        url = "https://github.com/Shopify/checkout-kit.git"
                    }
                }

                afterEvaluate {
                    from components.release
                }
            }
        }

        repositories {
            maven {
                name = 'ossrh-staging-api'
                url = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
                credentials {
                    username = System.getenv("OSSRH_USERNAME")
                    password = System.getenv("OSSRH_PASSWORD")
                }
            }
        }
    }
}
