name: checkout-kit-swift

type: ios

up:
  - packages:
      - mint
      - xcbeautify
      - rover
      - jq
  - custom:
      name: Bootstrap Mint packages
      met?: |
        set -e
        expected_swiftlint="$(sed -n 's#^realm/SwiftLint@##p' Mintfile)"
        expected_swiftformat="$(sed -n 's#^nicklockwood/SwiftFormat@##p' Mintfile)"
        swiftlint_bin="$(mint which swiftlint)"
        swiftformat_bin="$(mint which swiftformat)"
        test -n "$expected_swiftlint"
        test -n "$expected_swiftformat"
        test "$("$swiftlint_bin" version)" = "$expected_swiftlint"
        test "$("$swiftformat_bin" --version)" = "$expected_swiftformat"
      meet: mint bootstrap
  - xcode:
      version: "26.2"
      runtimes:
        ios:
          - version: 23C54 # 26.2
            architecture_variant: arm64
  - ruby
  - custom:
      name: Ensure Storefront.xcconfig file
      met?: |
        ([ -f "./samples/MobileBuyIntegration/Storefront.xcconfig" ] || exit 1)
      meet: ./scripts/ensure_storefront_config
  - custom:
      name: Setup entitlements
      met?: |
        ([ -f "./samples/MobileBuyIntegration/MobileBuyIntegration/MobileBuyIntegration.entitlements" ] || exit 1;)
      meet: ./scripts/setup_entitlements

check:
  lint: /opt/dev/bin/dev lint

commands:
  lint:
    aliases: [style]
    desc: Check format and lint issues across all Swift files using SwiftLint and SwiftFormat
    run: scripts/lint

  fix:
    desc: Automatically fix format and lint issues where possible
    run: scripts/lint fix

  build:
    subcommands:
      packages:
        desc: Build both ShopifyCheckoutKit and ShopifyAcceleratedCheckouts packages
        run: |
          ./scripts/xcode_run build ShopifyCheckoutKit
          ./scripts/xcode_run build ShopifyAcceleratedCheckouts
      samples:
        desc: Build all sample applications to verify integration
        run: ./scripts/build_samples

  test:
    desc: |
      `dev test` - Run all tests for the ShopifyCheckoutKit-Package.
      `dev test <test_class_name>` - Run only the specified test class.
    run: ./scripts/xcode_run test ShopifyCheckoutKit-Package "$1"
