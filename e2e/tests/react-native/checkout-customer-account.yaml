appId: ${APP_ID}
name: React Native checkout - customer account

env:
  # Sample app buyer identity configuration
  BUYER_IDENTITY_MODE: "customerAccount"

  # Benchmark-shop customer account fixture
  CUSTOMER_ACCOUNT_EMAIL: "checkout-kit-maestro@example.com"
  CUSTOMER_ACCOUNT_CODE: "${E2E_CUSTOMER_ACCOUNT_CODE}"

  # Checkout delivery fixture used when the account has no saved address
  FIRST_NAME: "Maestro"
  LAST_NAME: "Shopify"
  COUNTRY_LABEL: "United States"
  ADDRESS_LINE1: "700 S Flower St"
  CITY: "Los Angeles"
  STATE_FIELD_LABEL: "State"
  STATE_LABEL: "California"
  POSTAL_CODE: "90017"
  POSTAL_FIELD_LABEL: "ZIP code"

  # Checkout payment fixture
  CARD_NUMBER: "1"
  CARD_SECURITY_CODE: "123"

  # Accepted successful checkout states for this smoke test.
  POST_SUBMIT_RESULT_PATTERN: ".*(Thank you|Your order|Order confirmed|confirmation).*"
---
- runFlow: ../../flows/app/sign-in-customer-account.yaml

# Keep the authenticated app session alive while the deep link creates a fresh
# cart with the Customer Account access token as its buyer identity.
- runFlow: ../../flows/app/open-cart-from-link.yaml

- runFlow: ../../flows/checkout/present.yaml
- runFlow:
    when:
      visible: "Country/Region"
    commands:
      - runFlow: ../../flows/checkout/fill-customer-account-delivery.yaml
- runFlow: ../../flows/checkout/fill-payment-card.yaml
- runFlow: ../../flows/checkout/submit.yaml
- runFlow: ../../flows/checkout/assert-complete.yaml
- runFlow: ../../flows/checkout/assert-returned-to-empty-cart.yaml
