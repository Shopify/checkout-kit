appId: ${E2E_APP_ID}
name: Present checkout twice and observe SDK dismissal callbacks
tags:
  - checkout-presentation
  - smoke

env:
  E2E_CART_PARAMS: "productIndex=0&quantity=1"
---
# The sample supplies a URL and records public SDK callbacks. Checkout content and
# sample cart behavior are not assertions in this SDK presentation test.
- runFlow: ../../flows/app/bootstrap-cart-from-link.yaml
- assertVisible:
    id: checkout-callbacks-dismissed-0-completed-0-failed-0
- evalScript: ${output.dismissalCount = 0}
- repeat:
    times: 2
    commands:
      # Reuse the running host and its callback counters for the second presentation.
      - tapOn:
          id: checkout-button
          enabled: true
      - extendedWaitUntil:
          visible:
            id: "(shopify_checkout_kit_close_button|checkout_close_button)"
          timeout: 10000
      - runFlow: ../../flows/checkout/close.yaml
      - runFlow: ../../flows/checkout/assert-dismissed.yaml
      - evalScript: ${output.dismissalCount += 1}
      - extendedWaitUntil:
          visible:
            id: "checkout-callbacks-dismissed-${output.dismissalCount}-completed-0-failed-0"
          timeout: 10000
      - waitForAnimationToEnd
      - assertVisible:
          id: "checkout-callbacks-dismissed-${output.dismissalCount}-completed-0-failed-0"
