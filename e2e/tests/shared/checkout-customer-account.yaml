appId: ${E2E_APP_ID}
name: Checkout with a customer account
tags:
  - account
  # This test signs in and submits a real order, so it belongs to the expensive tier.
  - full

env:
  # The cart attaches the signed-in buyer, so checkout reads the contact address and the
  # saved delivery address from the account. Only payment is left to type.
  E2E_CART_PARAMS: "productIndex=0&quantity=1&buyerIdentityMode=customerAccount"

  # Checkout payment fixture. The shop runs the bogus gateway, which rejects real card
  # brands and reads a single digit instead: 1 approves, 2 declines, 3 fails the gateway.
  CARD_NUMBER: "1"
  CARD_NUMBER_DISPLAY: "1"
  CARD_SECURITY_CODE: "123"
  CARD_HOLDER_NAME: "Maestro Shopify"

  # Checkout billing fixture. Checkout copies the delivery address when it can, so the
  # billing section usually stays closed. These values cover the target that opens it.
  BILLING_FIRST_NAME: "Maestro"
  BILLING_LAST_NAME: "Shopify"
  BILLING_ADDRESS_LINE1: "700 S Flower St"
  BILLING_CITY: "Los Angeles"
  BILLING_POSTAL_FIELD_LABEL: "ZIP code"
  BILLING_POSTAL_CODE: "90017"

  # Accepted successful checkout states for this smoke test.
  POST_SUBMIT_RESULT_PATTERN: ".*(Thank you|Your order|Order confirmed|confirmation).*"
---
# Sign in before the cart exists. The buyer identity is attached when the cart is created,
# so a cart seeded ahead of the session would carry no customer.
- runFlow: ../../flows/app/launch.yaml
- runFlow: ../../flows/app/sign-in-customer-account.yaml
- runFlow: ../../flows/app/seed-cart-from-link.yaml
- runFlow: ../../flows/checkout/present.yaml
- runFlow: ../../flows/checkout/assert-buyer-prefilled.yaml
- runFlow: ../../flows/checkout/fill-payment-card.yaml
- runFlow: ../../flows/checkout/fill-billing-address.yaml
- runFlow: ../../flows/checkout/submit.yaml
- runFlow: ../../flows/checkout/assert-complete.yaml
- runFlow: ../../flows/checkout/assert-returned-to-empty-cart.yaml
