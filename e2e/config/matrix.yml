version: 1
changed_file_filters: .ci/changed-file-filters.yml
tests_path: tests
# Every run executes the whole tests folder and lets tags decide what runs there.
# An application may override either list to adopt a test ahead of the others.
tags:
  include:
    - launch
    - checkout
  exclude:
    - flaky
    - wip
    # Wallet tests require an explicitly configured, provisioned application row.
    - apple-pay
applications:
  - id: react-native-ios
    target: react-native
    platform: ios
    app_id: com.shopify.checkoutkit.reactnativedemo
    artifact_env: E2E_REACT_NATIVE_IOS_APP_PATH
    ready_marker: checkout-kit-sample-ready
    changed_files_filters:
      - reactNative
      - protocolTypescript
      - protocolShared
      - e2e
      - ciFilters
  - id: react-native-android
    target: react-native
    platform: android
    app_id: com.shopify.checkoutkit.reactnativedemo
    artifact_env: E2E_REACT_NATIVE_ANDROID_APP_PATH
    ready_marker: checkout-kit-sample-ready
    changed_files_filters:
      - reactNative
      - protocolTypescript
      - protocolShared
      - e2e
      - ciFilters
  - id: kotlin-android
    target: kotlin
    platform: android
    app_id: com.shopify.checkoutkit.androiddemo
    artifact_env: E2E_KOTLIN_ANDROID_APP_PATH
    ready_marker: checkout-kit-sample-ready
    # The preload journey reads the native samples' PreloadState callbacks, which only the
    # Swift and Kotlin samples surface, so the two native rows adopt it ahead of the others.
    # An override replaces the default list rather than extending it, so it restates the
    # defaults; dropping `checkout` here would silently retire that coverage on this row.
    include_tags:
      - launch
      - checkout
      - preload
    changed_files_filters:
      - android
      - protocolKotlin
      - protocolShared
      - e2e
      - ciFilters
  - id: swift-ios
    target: swift
    platform: ios
    app_id: com.shopify.checkoutkit.swiftdemo
    artifact_env: E2E_SWIFT_IOS_APP_PATH
    ready_marker: checkout-kit-sample-ready
    # See kotlin-android: the override restates the defaults and adds the preload journey.
    include_tags:
      - launch
      - checkout
      - preload
    changed_files_filters:
      - swift
      - protocolSwift
      - protocolShared
      - packageSwift
      - e2e
      - ciFilters
os_version_tags:
  - latest
