version: 1
changed_file_filters: .ci/changed-file-filters.yml
applications:
  - id: react-native-ios
    target: react-native
    platform: ios
    app_id: com.shopify.checkoutkit.reactnativedemo
    artifact_env: E2E_REACT_NATIVE_IOS_APP_PATH
    ready_marker: checkout-kit-sample-ready
    changed_files_filters:
      - reactNative
      - protocolTypescript
      - protocolShared
      - e2e
      - ciFilters
  - id: react-native-android
    target: react-native
    platform: android
    app_id: com.shopify.checkoutkit.reactnativedemo
    artifact_env: E2E_REACT_NATIVE_ANDROID_APP_PATH
    ready_marker: checkout-kit-sample-ready
    changed_files_filters:
      - reactNative
      - protocolTypescript
      - protocolShared
      - e2e
      - ciFilters
  - id: kotlin-android
    target: kotlin
    platform: android
    app_id: com.shopify.checkoutkit.androiddemo
    artifact_env: E2E_KOTLIN_ANDROID_APP_PATH
    ready_marker: checkout-kit-sample-ready
    changed_files_filters:
      - android
      - protocolKotlin
      - protocolShared
      - e2e
      - ciFilters
  - id: swift-ios
    target: swift
    platform: ios
    app_id: com.shopify.checkoutkit.swiftdemo
    artifact_env: E2E_SWIFT_IOS_APP_PATH
    ready_marker: checkout-kit-sample-ready
    changed_files_filters:
      - swift
      - protocolSwift
      - protocolShared
      - packageSwift
      - e2e
      - ciFilters
os_version_tags:
  - latest
suites:
  - id: launch-smoke
    execute: tests/shared/launch-smoke.yaml
