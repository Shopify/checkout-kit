version: 1
changed_file_filters: .ci/changed-file-filters.yml
applications:
  - id: react-native-ios
    target: react-native
    platform: ios
    app_id: com.shopify.checkoutkit.reactnativedemo
    artifact_env: E2E_REACT_NATIVE_IOS_APP_PATH
    ready_marker: checkout-kit-sample-ready
    changed_files_filters:
      - e2e
  # Keep the other applications in this disposable matrix so Bitrise receives
  # explicit false build flags for them. Their filter does not match this probe.
  - id: react-native-android
    target: react-native
    platform: android
    app_id: com.shopify.checkoutkit.reactnativedemo
    artifact_env: E2E_REACT_NATIVE_ANDROID_APP_PATH
    ready_marker: checkout-kit-sample-ready
    changed_files_filters:
      - ciFilters
  - id: kotlin-android
    target: kotlin
    platform: android
    app_id: com.shopify.checkoutkit.androiddemo
    artifact_env: E2E_KOTLIN_ANDROID_APP_PATH
    ready_marker: checkout-kit-sample-ready
    changed_files_filters:
      - ciFilters
os_version_tags:
  - latest
suites:
  - id: preload-offline-probe
    execute: tests/react-native/checkout-preloading-offline-probe.yaml
    network_profile: no-network
    network_profile_after_session_seconds: 30
