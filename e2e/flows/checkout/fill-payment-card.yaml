appId: ${E2E_APP_ID}
---
- scrollUntilVisible:
    element:
      text: "^Card number$"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "^Card number$"
- waitForAnimationToEnd
- inputText: "${CARD_NUMBER}"
# Checkout groups the digits, so the field never reads back the value the test typed.
- extendedWaitUntil:
    visible: "^${CARD_NUMBER_DISPLAY}$"
- runFlow: dismiss-active-field.yaml
- scrollUntilVisible:
    element:
      text: "^Expiration date \\(MM / YY\\)$"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "^Expiration date \\(MM / YY\\)$"
- waitForAnimationToEnd
- inputText: "1"
- inputText: "2"
- waitForAnimationToEnd
- inputText: "3"
- inputText: "0"
- runFlow: dismiss-active-field.yaml
- tapOn:
    text: "^Security code$"
- waitForAnimationToEnd
- inputText: "${CARD_SECURITY_CODE}"
- runFlow: dismiss-active-field.yaml
- tapOn:
    text: "^Name on card$"
- waitForAnimationToEnd
- eraseText
- inputText: "${CARD_HOLDER_NAME}"
- runFlow: dismiss-active-field.yaml
- waitForAnimationToEnd
