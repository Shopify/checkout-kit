appId: ${E2E_APP_ID}
---
- scrollUntilVisible:
    element:
      text: "^Card number$"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      platform: ios
    commands:
      - tapOn:
          text: "^Field container for: Card number$"
- runFlow:
    when:
      platform: android
    commands:
      - tapOn:
          text: "^Card number$"
- waitForAnimationToEnd
- inputText: "${CARD_NUMBER}"
# Checkout groups the digits, so the field never reads back the value the test typed.
- runFlow:
    when:
      platform: ios
    commands:
      - extendedWaitUntil:
          visible:
            text: "^${CARD_NUMBER_DISPLAY}$"
            below:
              text: "^Card number$"
            above:
              text: "^Expiration date \\(MM / YY\\)$"
- runFlow:
    when:
      platform: android
    commands:
      - extendedWaitUntil:
          visible: "^${CARD_NUMBER_DISPLAY}$"
- runFlow:
    when:
      platform: ios
    commands:
      - tapOn:
          text: "^Field container for: Expiration date \\(MM / YY\\)$"
- runFlow:
    when:
      platform: android
    commands:
      - tapOn:
          text: "^Expiration date \\(MM / YY\\)$"
- waitForAnimationToEnd
- inputText: "1"
- inputText: "2"
- waitForAnimationToEnd
- inputText: "3"
- inputText: "0"
- runFlow:
    when:
      platform: ios
    commands:
      - extendedWaitUntil:
          visible:
            text: "^12 / 30$"
            below:
              text: "^Expiration date \\(MM / YY\\)$"
            above:
              text: "^Security code$"
- runFlow:
    when:
      platform: android
    commands:
      - extendedWaitUntil:
          visible: "^12 / 30$"
- runFlow: dismiss-active-field.yaml
- runFlow:
    when:
      platform: ios
    commands:
      - tapOn:
          text: "^Field container for: Security code$"
- runFlow:
    when:
      platform: android
    commands:
      - tapOn:
          text: "^Security code$"
- waitForAnimationToEnd
- inputText: "${CARD_SECURITY_CODE}"
- runFlow: dismiss-active-field.yaml
- runFlow:
    when:
      notVisible:
        text: "^${CARD_HOLDER_NAME}$"
        below:
          text: "^Security code$"
    commands:
      - tapOn:
          text: "^Name on card$"
      - waitForAnimationToEnd
      - inputText: "${CARD_HOLDER_NAME}"
      - runFlow: dismiss-active-field.yaml
- extendedWaitUntil:
    visible:
      text: "^${CARD_HOLDER_NAME}$"
      below:
        text: "^Security code$"
- runFlow:
    when:
      platform: ios
    commands:
      - extendedWaitUntil:
          visible:
            text: "^${CARD_NUMBER_DISPLAY}$"
            below:
              text: "^Card number$"
            above:
              text: "^Expiration date \\(MM / YY\\)$"
- runFlow:
    when:
      platform: android
    commands:
      - extendedWaitUntil:
          visible: "^${CARD_NUMBER_DISPLAY}$"
- waitForAnimationToEnd
