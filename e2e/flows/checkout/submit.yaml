appId: ${E2E_APP_ID}
---
# Maestro can find the pay button behind the keyboard and tap a key instead.
# Dismiss the keyboard before scrolling the button into view.
- runFlow: dismiss-active-field.yaml
- scrollUntilVisible:
    element:
      text: "^(Pay now|Complete order|Review order)$"
    direction: DOWN
    centerElement: true

# A shop that shows shipping options keeps the pay action behind a review step. One button
# carries both labels, so the review tap comes first and the pay tap follows it.
- runFlow:
    when:
      visible: "^Review order$"
    commands:
      - tapOn:
          text: "^Review order$"
          enabled: true
      - extendedWaitUntil:
          visible: "^(Pay now|Complete order)$"
          timeout: 30000
      - scrollUntilVisible:
          element:
            text: "^(Pay now|Complete order)$"
          direction: DOWN
          centerElement: true
- tapOn:
    text: "^(Pay now|Complete order)$"
    enabled: true
