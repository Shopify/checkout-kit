appId: ${E2E_APP_ID}
---
- scrollUntilVisible:
    element:
      text: "^${FIELD_LABEL}$"
    direction: UP
    centerElement: true
- runFlow:
    when:
      platform: ios
    commands:
      - runFlow:
          when:
            true: ${HAS_NEXT_FIELD == 'true'}
          commands:
            - extendedWaitUntil:
                visible:
                  text: "^${EXPECTED_TEXT}$"
                  below:
                    text: "^${FIELD_LABEL}$"
                  above:
                    text: "^${NEXT_FIELD_LABEL}$"
      - runFlow:
          when:
            true: ${HAS_NEXT_FIELD == 'false'}
          commands:
            - extendedWaitUntil:
                visible:
                  text: "^${EXPECTED_TEXT}$"
                  below:
                    text: "^${FIELD_LABEL}$"
- runFlow:
    when:
      platform: android
    commands:
      - extendedWaitUntil:
          visible: "^${EXPECTED_TEXT}$"
