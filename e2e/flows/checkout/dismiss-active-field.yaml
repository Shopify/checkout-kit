appId: ${APP_ID}
---
- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: ios
      visible: "selected"
    commands:
      - tapOn: "selected"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Close suggestions"
    commands:
      - tapOn: "Close suggestions"
      - waitForAnimationToEnd
