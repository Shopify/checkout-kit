appId: ${E2E_APP_ID}
---
- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard
# iOS keeps the keyboard above the page until the accessory bar closes it. The next field
# then stays behind the keyboard, and the tap that follows lands on a key instead.
- runFlow:
    when:
      platform: ios
      visible: "Done"
    commands:
      - tapOn: "Done"
      - waitForAnimationToEnd
# The checkout page also renders a disabled 24 by 22 pixel node whose accessibility text is
# "selected". Without enabled: true the branch taps that node after every text entry, and the
# field that follows never opens.
- runFlow:
    when:
      platform: ios
      visible:
        text: "selected"
        enabled: true
    commands:
      - tapOn:
          text: "selected"
          enabled: true
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Close suggestions"
    commands:
      - tapOn: "Close suggestions"
      - waitForAnimationToEnd
