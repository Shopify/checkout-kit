appId: ${APP_ID}
---
- tapOn:
    text: "^Email( or mobile phone number)?$"
- waitForAnimationToEnd
- inputText: "${EMAIL}"
- runFlow: dismiss-active-field.yaml
- extendedWaitUntil:
    visible: "^${EMAIL}$"
    timeout: 10000
- tapOn:
    text: "^First name( \\(optional\\))?$"
- waitForAnimationToEnd
- inputText: "${FIRST_NAME}"
- runFlow: dismiss-active-field.yaml
- scrollUntilVisible:
    element:
      text: "^Last name$"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 10000
- tapOn:
    text: "^Last name$"
- waitForAnimationToEnd
- inputText: "${LAST_NAME}"
- runFlow: dismiss-active-field.yaml
