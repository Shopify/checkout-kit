appId: ${E2E_APP_ID}
---
- scrollUntilVisible:
    element:
      text: "${LOCATOR}"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "${LOCATOR}"
- waitForAnimationToEnd
- inputText: "${TEXT_TO_INPUT}"
- runFlow: dismiss-active-field.yaml
- extendedWaitUntil:
    visible: "^${TEXT_TO_INPUT}$"
