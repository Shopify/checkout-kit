appId: ${E2E_APP_ID}
---
- runFlow:
    file: scroll-until-visible-bidirectional.yaml
    env:
      LOCATOR: "${LOCATOR}"
      INITIAL_DIRECTION: "DOWN"
- tapOn:
    text: "${LOCATOR}"
- waitForAnimationToEnd
- inputText: "${TEXT_TO_INPUT}"
- runFlow: dismiss-active-field.yaml
- extendedWaitUntil:
    visible: "^${TEXT_TO_INPUT}$"
- runFlow:
    when:
      true: ${typeof DISMISS_SUGGESTIONS !== 'undefined' && DISMISS_SUGGESTIONS == 'true'}
    commands:
      - runFlow:
          when:
            visible: "Close suggestions"
          commands:
            - tapOn: "Close suggestions"
            - waitForAnimationToEnd
