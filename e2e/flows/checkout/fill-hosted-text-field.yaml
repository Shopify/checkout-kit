appId: ${E2E_APP_ID}
---
- runFlow:
    when:
      true: ${SCROLL_TO_FIELD == 'true'}
    commands:
      - runFlow:
          file: scroll-until-visible-bidirectional.yaml
          env:
            LOCATOR: "^${FIELD_LABEL}$"
            INITIAL_DIRECTION: "DOWN"
- tapOn:
    text: "^${FIELD_LABEL}$"
- waitForAnimationToEnd
- inputText: "${TEXT_TO_INPUT}"
