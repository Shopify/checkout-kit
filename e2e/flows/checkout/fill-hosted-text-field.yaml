appId: ${E2E_APP_ID}
---
- runFlow:
    when:
      platform: ios
    commands:
      - runFlow:
          when:
            true: ${SCROLL_TO_FIELD == 'true'}
          commands:
            - scrollUntilVisible:
                element:
                  text: "^Field container for: ${FIELD_LABEL}$"
                direction: DOWN
                centerElement: true
      - tapOn:
          text: "^Field container for: ${FIELD_LABEL}$"
- runFlow:
    when:
      platform: android
    commands:
      - runFlow:
          when:
            true: ${SCROLL_TO_FIELD == 'true'}
          commands:
            - scrollUntilVisible:
                element:
                  text: "^${FIELD_LABEL}$"
                direction: DOWN
                centerElement: true
      - tapOn:
          text: "^${FIELD_LABEL}$"
- waitForAnimationToEnd
- inputText: "${TEXT_TO_INPUT}"
