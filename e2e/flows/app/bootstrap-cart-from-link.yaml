appId: ${APP_ID}
---
- launchApp:
    clearState: true
    arguments:
      # iOS-only launch arguments; Android ignores them.
      AppleLocale: en_US
      AppleLanguages: "(en)"
- extendedWaitUntil:
    visible:
      id: checkout-kit-sample-ready
    timeout: 10000
# Reset app data before testing the deep-link cold-start path. The app is
# stopped so openLink is the launch that seeds the cart.
- stopApp
- openLink: "${CART_BOOTSTRAP_LINK}"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: cart-checkout-ready
    timeout: 10000
