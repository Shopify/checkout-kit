appId: ${E2E_APP_ID}
---
- runFlow:
    when:
      platform: android
      visible:
        id: "^com\\.google\\.android\\.inputmethod\\.latin:id/.*$"
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: ios
    commands:
      # Toolbar nodes can outlive the keyboard. Check its delete key, prefer
      # Done, and retry failed dismissals instead of polling after every tap.
      - retry:
          maxRetries: 1
          commands:
            - runFlow:
                when:
                  visible:
                    text: "^[Dd]elete$"
                commands:
                  - waitForAnimationToEnd
                  - evalScript: ${output.keyboardDoneTapped = false}
                  - runFlow:
                      when:
                        visible: "^Done$"
                      commands:
                        - tapOn: "^Done$"
                        - evalScript: ${output.keyboardDoneTapped = true}
                  - runFlow:
                      when:
                        true: ${!output.keyboardDoneTapped}
                      commands:
                        - tapOn: "^selected$"
                  - waitForAnimationToEnd
            - extendedWaitUntil:
                notVisible:
                  text: "^[Dd]elete$"
                timeout: 5000
