appId: ${E2E_APP_ID}
---
- runFlow:
    when:
      platform: android
      visible:
        id: "^com\\.google\\.android\\.inputmethod\\.latin:id/.*$"
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: ios
    commands:
      # iOS exposes the checkmark as "Done" or "selected". Its coordinates can be
      # stale while the keyboard opens, so look it up again if dismissal misses.
      - repeat:
          times: 2
          while:
            visible:
              id: "^Toolbar$"
          commands:
            - waitForAnimationToEnd
            - tapOn:
                text: "^(Done|selected)$"
                childOf:
                  id: "^Toolbar$"
            - waitForAnimationToEnd
      - extendedWaitUntil:
          notVisible:
            id: "^(Toolbar|delete)$"
          timeout: 5000
