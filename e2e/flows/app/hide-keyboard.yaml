appId: ${E2E_APP_ID}
---
- runFlow:
    when:
      platform: android
      visible:
        id: "^com\\.google\\.android\\.inputmethod\\.latin:id/.*$"
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: ios
    commands:
      # iOS exposes the checkmark as "Done" or "selected". On iOS 27 it is not
      # inside the Toolbar accessibility subtree, so use Toolbar only to check
      # visibility. Prefer Done to avoid matching unrelated "selected" content.
      # Look up the control again if stale coordinates make dismissal miss.
      - repeat:
          times: 2
          while:
            visible:
              id: "^Toolbar$"
          commands:
            - waitForAnimationToEnd
            - runFlow:
                when:
                  visible: "^Done$"
                commands:
                  - tapOn: "^Done$"
            - runFlow:
                when:
                  visible:
                    id: "^Toolbar$"
                  notVisible: "^Done$"
                commands:
                  - tapOn: "^selected$"
            - waitForAnimationToEnd
      - extendedWaitUntil:
          notVisible:
            id: "^(Toolbar|delete)$"
          timeout: 5000
