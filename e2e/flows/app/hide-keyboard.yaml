appId: ${E2E_APP_ID}
---
- runFlow:
    when:
      platform: android
      visible:
        id: "^com\\.google\\.android\\.inputmethod\\.latin:id/.*$"
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: ios
      visible: "Done"
    commands:
      - tapOn: "Done"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: ios
      visible: "selected"
    commands:
      - tapOn: "selected"
      - waitForAnimationToEnd
