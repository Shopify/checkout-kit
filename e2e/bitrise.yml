format_version: "23"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

meta:
  bitrise.io:
    # Keep this stack, the macOS stack, and the Ruby line (see tools: below)
    # aligned. Bump them together — android -> 2026 edition, macOS -> Xcode 27,
    # Ruby -> the next line both stacks preinstall — so every workflow keeps
    # pulling a preinstalled Ruby and builds stay fast.
    stack: &android_stack ubuntu-noble-24.04-bitrise-2025-android
    machine_type_id: g2.linux.medium

app:
  envs:
    - E2E_BROWSERSTACK_API_RETRIES: "1"
    - E2E_BROWSERSTACK_TIMEOUT_SECONDS: "1800"
    - E2E_BROWSERSTACK_POLL_SECONDS: "30"

tools:
  # "3.4:installed" tells each pinned stack to use its own preinstalled 3.4.x
  # (no ~3-min source compile). Local dev and GitHub Actions pin the exact patch
  # via the repo-root .ruby-version (3.4.8). The patch level and the interpreter
  # path a stack serves both move when its image is refreshed, so nothing may
  # assume a fixed Ruby here — see install-ruby-gems for why the gem cache is
  # keyed on the interpreter.
  # When bumping stacks (see meta.bitrise.io above), move this line to the next
  # Ruby both stacks preinstall so all workflows stay on a preinstalled version.
  ruby: 3.4:installed
  nodejs: 22.14.0

trigger_map:
  - pull_request_source_branch: "*"
    draft_pull_request_enabled: false
    changed_files:
      # Bitrise evaluates this with Go's RE2 engine. Use only basic syntax
      # (anchors, groups, alternation, character classes, quantifiers). Do not
      # add lookahead (?=…), lookbehind, backreferences (\1), or atomic/possessive
      # groups — RE2 cannot compile them and the trigger will fail to evaluate.
      regex: '^(platforms/(swift|android|react-native)|protocol|e2e|\.ci)/.*|^Package\.(swift|resolved)$'
    pipeline: e2e

pipelines:
  e2e:
    workflows:
      e2e-produce-browserstack-run-plan: {}
      e2e-build-react-native-ios:
        run_if:
          expression: '{{ enveq "E2E_BUILD_REACT_NATIVE_IOS" "true" }}'
        depends_on:
          - e2e-produce-browserstack-run-plan
      e2e-build-react-native-android:
        run_if:
          expression: '{{ enveq "E2E_BUILD_REACT_NATIVE_ANDROID" "true" }}'
        depends_on:
          - e2e-produce-browserstack-run-plan
      e2e-build-kotlin-android:
        run_if:
          expression: '{{ enveq "E2E_BUILD_KOTLIN_ANDROID" "true" }}'
        depends_on:
          - e2e-produce-browserstack-run-plan
      e2e-build-swift-ios:
        run_if:
          expression: '{{ enveq "E2E_BUILD_SWIFT_IOS" "true" }}'
        depends_on:
          - e2e-produce-browserstack-run-plan
      e2e-execute-browserstack-run:
        run_if:
          expression: '{{ enveq "E2E_HAS_E2E_RUNS" "true" }}'
        depends_on:
          - e2e-produce-browserstack-run-plan
          - e2e-build-react-native-ios
          - e2e-build-react-native-android
          - e2e-build-kotlin-android
          - e2e-build-swift-ios
        parallel: $E2E_BROWSERSTACK_RUN_PLAN_PARALLEL_COUNT
      e2e-report:
        run_if:
          expression: '{{ enveq "E2E_HAS_E2E_RUNS" "true" }}'
        depends_on:
          - e2e-execute-browserstack-run
        should_always_run: workflow

  # Deliberately absent from trigger_map: a scheduled build in the Bitrise UI is
  # the only thing that starts this, alongside a manual start or the API. Do not
  # add a `triggers:` block either — Bitrise rejects a config that mixes it with
  # the legacy trigger_map above.
  nightly-swift-ios-testflight:
    workflows:
      nightly-decide-should-build: {}
      nightly-release-swift-ios:
        run_if:
          expression: '{{ enveq "NIGHTLY_SHOULD_BUILD" "true" }}'
        depends_on:
          - nightly-decide-should-build

step_bundles:
  install-node-modules:
    steps:
      - restore-cache@3:
          inputs:
            - key: &rn_node_modules_cache_key |-
                rn-node-modules-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/react-native/pnpm-lock.yaml" }}
      - script@1:
          title: Install React Native dependencies
          inputs:
            - content: |-
                set -euo pipefail
                source e2e/scripts/bitrise_ci_helpers
                e2e_enable_corepack
                cd platforms/react-native
                pnpm install --frozen-lockfile
      - save-cache@1:
          inputs:
            - key: *rn_node_modules_cache_key
            - paths: platforms/react-native/node_modules
  install-ruby-gems:
    steps:
      - script@1:
          title: Fingerprint Ruby for the gem cache key
          inputs:
            - content: |-
                set -euo pipefail
                # The bundle is built with BUNDLE_FORCE_RUBY_PLATFORM, so gems like
                # bigdecimal and ffi are compiled from source and bake the absolute
                # path of libruby into their .bundle/.so. The stacks serve Ruby out
                # of the nix store, and that path changes whenever a stack image is
                # refreshed even when the version string does not. Without the
                # interpreter in the cache key, a bundle compiled against the old
                # Ruby is restored onto the new one and every native gem fails to
                # dlopen, which takes down `pod install` before it does any work.
                ruby -rrbconfig -e 'puts [RbConfig::CONFIG["prefix"], RUBY_VERSION, RUBY_PLATFORM]' > .ruby-cache-fingerprint
                cat .ruby-cache-fingerprint
      - restore-cache@3:
          inputs:
            - key: &rn_ruby_gems_cache_key |-
                rn-ruby-gems-{{ .OS }}-{{ .Arch }}-{{ checksum ".ruby-cache-fingerprint" }}-{{ checksum "platforms/react-native/sample/Gemfile.lock" }}
      - script@1:
          title: Install iOS Ruby dependencies
          inputs:
            - content: |-
                set -euo pipefail
                cd platforms/react-native/sample
                bundle install
      - save-cache@1:
          inputs:
            - key: *rn_ruby_gems_cache_key
            - paths: platforms/react-native/sample/vendor/bundle
  install-cocoapods:
    steps:
      - restore-cache@3:
          inputs:
            - key: &rn_cocoapods_cache_key |-
                rn-cocoapods-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/react-native/sample/ios/Podfile.lock" }}
      - script@1:
          title: Install CocoaPods dependencies
          inputs:
            - content: |-
                set -euo pipefail
                cd platforms/react-native/sample/ios
                bundle exec pod install --deployment
      - save-cache@1:
          inputs:
            - key: *rn_cocoapods_cache_key
            - paths: platforms/react-native/sample/ios/Pods
  bootstrap-mint:
    inputs:
      - mintfile_dir: ""
    steps:
      - restore-cache@3:
          inputs:
            - key: &mint_cache_key |-
                mint-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/swift/Mintfile" }}
      - script@1:
          title: Bootstrap Mint dependencies
          inputs:
            - content: |-
                set -euo pipefail
                : "${mintfile_dir:?mintfile_dir input is required}"
                if ! command -v mint >/dev/null 2>&1; then
                  brew install mint
                fi
                cd "$mintfile_dir"
                mint bootstrap
      - save-cache@1:
          inputs:
            - key: *mint_cache_key
            - paths: ~/.mint

workflows:
  e2e-produce-browserstack-run-plan:
    steps:
      - git-clone@8: {}
      - script@1:
          title: Produce BrowserStack run plan
          timeout: 1800
          no_output_timeout: 900
          inputs:
            - content: |-
                set -euo pipefail
                source e2e/scripts/bitrise_ci_helpers
                changed_files="$(e2e_deploy_dir)/changed-files.txt"
                e2e_log "Fetching pull request changed files"
                # PR builds: the checkout is a shallow merge commit, so the GitHub API
                # is the authoritative source for the PR's changed files. Non-PR runs
                # (manual, scheduled, local) fall back to diffing the branch against its
                # base with a three-dot range (changes since the merge-base, not tip-to-tip).
                if [ -n "${BITRISE_PULL_REQUEST:-}" ]; then
                  ruby e2e/scripts/github_pr_changed_files > "$changed_files"
                else
                  git diff --name-only "${BITRISE_GIT_BRANCH_DEST:-origin/main}...HEAD" > "$changed_files"
                fi
                ruby e2e/scripts/e2e_matrix_to_browserstack_run_plan validate --changed-files-file "$changed_files"
                # Guard against config-vs-matrix drift: Bitrise resolves the pipeline graph from
                # the branch-head bitrise.yml (before the merge checkout), while the matrix here is
                # generated from the merged tree. A stale branch can select a target whose build
                # workflow does not exist in the graph, which fails cryptically later in
                # e2e-execute-browserstack-run. Fail fast against the branch-head config instead.
                e2e_log "Asserting the pipeline can build every selected target"
                branch_config="$(e2e_deploy_dir)/branch-bitrise.yml"
                if [ -z "${BITRISE_PULL_REQUEST:-}" ] || [ -z "${BITRISE_GIT_COMMIT:-}" ] || ! git show "${BITRISE_GIT_COMMIT}:e2e/bitrise.yml" > "$branch_config" 2>/dev/null; then
                  cp e2e/bitrise.yml "$branch_config"
                fi
                ruby e2e/scripts/e2e_matrix_to_browserstack_run_plan assert-pipeline-coverage --pipeline-config "$branch_config" --changed-files-file "$changed_files"
                e2e_log "Producing BrowserStack run plan"
                ruby e2e/scripts/e2e_matrix_to_browserstack_run_plan expand --changed-files-file "$changed_files" > "$BITRISE_DEPLOY_DIR/browserstack-run-plan.json"
                e2e_log "Publishing BrowserStack run plan environment"
                bitrise_env_file="$(e2e_deploy_dir)/bitrise-env.txt"
                ruby e2e/scripts/e2e_matrix_to_browserstack_run_plan bitrise-env --changed-files-file "$changed_files" > "$bitrise_env_file"
                while IFS='=' read -r key value; do
                  envman add --key "$key" --value "$value"
                done < "$bitrise_env_file"
                e2e_log "Zipping E2E tests"
                tests_zip="$(e2e_deploy_dir)/e2e-tests.zip"
                e2e/scripts/zip_e2e_tests --output "$tests_zip"
                e2e_log "Publishing E2E tests zip path"
                envman add --key E2E_TESTS_ZIP --value "$tests_zip"
      - share-pipeline-variable@1:
          inputs:
            - variables: |-
                E2E_BROWSERSTACK_RUN_PLAN_COUNT
                E2E_BROWSERSTACK_RUN_PLAN_PARALLEL_COUNT
                E2E_HAS_E2E_RUNS
                E2E_BUILD_REACT_NATIVE_IOS
                E2E_BUILD_REACT_NATIVE_ANDROID
                E2E_BUILD_KOTLIN_ANDROID
                E2E_BUILD_SWIFT_IOS
      - deploy-to-bitrise-io@2:
          is_always_run: false
          inputs:
            - pipeline_intermediate_files: |-
                $E2E_TESTS_ZIP:E2E_TESTS_ZIP
                $BITRISE_DEPLOY_DIR/browserstack-run-plan.json:E2E_BROWSERSTACK_RUN_PLAN_JSON

  e2e-build-react-native-ios:
    meta:
      bitrise.io:
        # Keep in sync with dev.yml's xcode.version (26.2). Bitrise stable stacks
        # only receive Xcode patch updates, so this pins Xcode 26.2 / iOS 26.2
        # (23C54) to match local development.
        stack: &macos_stack osx-xcode-26.2.x
        machine_type_id: g2.mac.4large
    steps:
      - git-clone@8: {}
      - certificate-and-profile-installer@1: {}
      - bundle::install-node-modules: {}
      - bundle::install-ruby-gems: {}
      - bundle::install-cocoapods: {}
      - script@1:
          title: Build React Native iOS IPA artifact
          timeout: 5400
          no_output_timeout: 1800
          inputs:
            - content: |-
                set -euo pipefail
                e2e/scripts/build_react_native_ios
      - deploy-to-bitrise-io@2:
          is_always_run: false
          inputs:
            - pipeline_intermediate_files: |-
                $E2E_REACT_NATIVE_IOS_APP_PATH:E2E_REACT_NATIVE_IOS_APP_PATH
                $E2E_REACT_NATIVE_IOS_SIMULATOR_APP_PATH:E2E_REACT_NATIVE_IOS_SIMULATOR_APP_PATH

  e2e-build-react-native-android:
    meta:
      bitrise.io:
        stack: *android_stack
        machine_type_id: g2.linux.large
    steps:
      - git-clone@8: {}
      - bundle::install-node-modules: {}
      - restore-cache@3:
          inputs:
            - key: &rn_gradle_cache_key |-
                rn-gradle-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/react-native/sample/android/**/*.gradle*" }}
      - script@1:
          title: Build React Native Android APK artifact
          timeout: 3600
          no_output_timeout: 1800
          inputs:
            - content: |-
                set -euo pipefail
                e2e/scripts/build_react_native_android
      - deploy-to-bitrise-io@2:
          inputs:
            - pipeline_intermediate_files: |-
                $E2E_REACT_NATIVE_ANDROID_APP_PATH:E2E_REACT_NATIVE_ANDROID_APP_PATH
      - save-cache@1:
          inputs:
            - key: *rn_gradle_cache_key
            - paths: |-
                ~/.gradle/caches
                ~/.gradle/wrapper

  e2e-build-kotlin-android:
    meta:
      bitrise.io:
        stack: *android_stack
        machine_type_id: g2.linux.large
    steps:
      - git-clone@8: {}
      - restore-cache@3:
          inputs:
            - key: &kotlin_gradle_cache_key |-
                kotlin-gradle-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/android/samples/CheckoutKitAndroidDemo/**/*.gradle*" }}
      - script@1:
          title: Build Kotlin Android APK artifact
          timeout: 3600
          no_output_timeout: 1800
          inputs:
            - content: |-
                set -euo pipefail
                e2e/scripts/build_kotlin_android
      - deploy-to-bitrise-io@2:
          inputs:
            - pipeline_intermediate_files: |-
                $E2E_KOTLIN_ANDROID_APP_PATH:E2E_KOTLIN_ANDROID_APP_PATH
      - save-cache@1:
          inputs:
            - key: *kotlin_gradle_cache_key
            - paths: |-
                ~/.gradle/caches
                ~/.gradle/wrapper

  e2e-build-swift-ios:
    meta:
      bitrise.io:
        stack: *macos_stack
        machine_type_id: g2.mac.4large
    steps:
      - git-clone@8: {}
      - certificate-and-profile-installer@1: {}
      - bundle::bootstrap-mint:
          inputs:
            - mintfile_dir: platforms/swift
      - script@1:
          title: Build Swift iOS IPA artifact
          timeout: 5400
          no_output_timeout: 1800
          inputs:
            - content: |-
                set -euo pipefail
                e2e/scripts/build_swift_ios
      - deploy-to-bitrise-io@2:
          is_always_run: false
          inputs:
            - pipeline_intermediate_files: |-
                $E2E_SWIFT_IOS_APP_PATH:E2E_SWIFT_IOS_APP_PATH
                $E2E_SWIFT_IOS_SIMULATOR_APP_PATH:E2E_SWIFT_IOS_SIMULATOR_APP_PATH

  e2e-execute-browserstack-run:
    steps:
      - git-clone@8: {}
      - pull-intermediate-files@1:
          inputs:
            - artifact_sources: e2e-produce-browserstack-run-plan,e2e-build-.*
      - script@1:
          title: Execute BrowserStack run
          timeout: 2700
          no_output_timeout: 1350
          inputs:
            - content: |-
                set -euo pipefail
                source e2e/scripts/bitrise_ci_helpers
                : "${BITRISE_IO_PARALLEL_INDEX:?BITRISE_IO_PARALLEL_INDEX is required for the parallel e2e-execute-browserstack-run workflow.}"
                run_index="$BITRISE_IO_PARALLEL_INDEX"
                results_root="$BITRISE_DEPLOY_DIR/e2e/results"
                results_dir="$results_root/run-${run_index}"
                mkdir -p "$results_dir"
                envman add --key E2E_BROWSERSTACK_RESULTS_DIR --value "$results_dir"
                : "${BROWSERSTACK_USERNAME:?BROWSERSTACK_USERNAME is required}"
                : "${BROWSERSTACK_ACCESS_KEY:?BROWSERSTACK_ACCESS_KEY is required}"
                : "${E2E_TESTS_ZIP:?E2E_TESTS_ZIP is required. Check e2e-execute-browserstack-run pull-intermediate-files artifact_sources.}"
                : "${E2E_BROWSERSTACK_RUN_PLAN_JSON:?E2E_BROWSERSTACK_RUN_PLAN_JSON is required. Check e2e-execute-browserstack-run pull-intermediate-files artifact_sources.}"
                run_artifact_env="$(ruby -rjson -e 'run_plan = JSON.parse(File.read(ARGV.fetch(0))); puts run_plan.fetch(Integer(ARGV.fetch(1))).fetch("artifact_env")' "$E2E_BROWSERSTACK_RUN_PLAN_JSON" "$run_index")"
                : "${!run_artifact_env:?${run_artifact_env} is required. Check e2e-execute-browserstack-run pull-intermediate-files artifact_sources.}"
                e2e_log "Executing BrowserStack run plan row ${run_index}"
                e2e/scripts/execute_browserstack_run \
                  --index "$run_index" \
                  --run-plan "$E2E_BROWSERSTACK_RUN_PLAN_JSON" \
                  --tests-zip "$E2E_TESTS_ZIP" \
                  --output-dir "$results_dir"
      - deploy-to-bitrise-io@2:
          is_always_run: true
          inputs:
            - pipeline_intermediate_files: |-
                $BITRISE_DEPLOY_DIR/e2e/results:E2E_BROWSERSTACK_RESULTS_DIR

  e2e-report:
    steps:
      - git-clone@8: {}
      - pull-intermediate-files@1:
          inputs:
            - artifact_sources: e2e-produce-browserstack-run-plan,e2e-execute-browserstack-run.*
      - script@1:
          title: Report E2E results to GitHub
          timeout: 900
          no_output_timeout: 450
          inputs:
            - content: |-
                set -euo pipefail
                source e2e/scripts/bitrise_ci_helpers
                e2e_log "Checking GitHub reporting configuration"
                if [ -z "${GITHUB_TOKEN:-}" ]; then
                  : "${GIT_HTTP_PASSWORD:?GITHUB_TOKEN or Bitrise GitHub App GIT_HTTP_PASSWORD is required. Enable Project settings > Repository > Extend GitHub App permissions to builds.}"
                  export GITHUB_TOKEN="$GIT_HTTP_PASSWORD"
                fi
                : "${BITRISE_GIT_COMMIT:?BITRISE_GIT_COMMIT is required}"
                results_root="${E2E_BROWSERSTACK_RESULTS_DIR:-$BITRISE_DEPLOY_DIR/e2e/results}"
                # The report names the stages that failed from this roster. Bitrise documents no
                # enum for its status field, so log the payload to confirm the literals it uses.
                e2e_log "Pipeline stage roster"
                printf '%s\n' "${BITRISEIO_FINISHED_WORKFLOWS:-<unset>}"
                e2e_log "Reporting E2E results to GitHub"
                e2e/scripts/report_e2e_results --results-root "$results_root"

  # Shared by every nightly pipeline. Runs on the cheap default Linux stack so a
  # night with no new commits never boots a macOS machine at all.
  nightly-decide-should-build:
    steps:
      - git-clone@8: {}
      - script@1:
          title: Decide whether the nightly build runs
          timeout: 300
          inputs:
            - content: |-
                set -euo pipefail
                source e2e/scripts/bitrise_ci_helpers
                e2e_nightly_should_build
      - share-pipeline-variable@1:
          inputs:
            - variables: NIGHTLY_SHOULD_BUILD

  nightly-release-swift-ios:
    meta:
      bitrise.io:
        stack: *macos_stack
        machine_type_id: g2.mac.4large
    # Scoped to this workflow, not app.envs, because each iOS app needs its own
    # App Store profile. The build script exits if this is missing.
    envs:
      - NIGHTLY_IOS_PROVISIONING_PROFILE_SPECIFIER: PP-Bitrise-com.shopify.checkoutkit.swiftdemo
    steps:
      - git-clone@8: {}
      - certificate-and-profile-installer@1: {}
      - bundle::bootstrap-mint:
          inputs:
            - mintfile_dir: platforms/swift
      - script@1:
          title: Build the Swift iOS App Store IPA
          timeout: 5400
          no_output_timeout: 1800
          inputs:
            - content: |-
                set -euo pipefail
                e2e/scripts/build_swift_ios_testflight
      - deploy-to-itunesconnect-application-loader@2:
          inputs:
            # `automatic` uses the App Store Connect API key already configured on
            # the Bitrise app, so this workflow needs no upload secret of its own.
            - connection: automatic
            - ipa_path: $NIGHTLY_SWIFT_IOS_IPA_PATH
      - deploy-to-bitrise-io@2:
          is_always_run: false
