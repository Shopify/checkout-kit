format_version: "23"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

meta:
  bitrise.io:
    # Keep this stack, the macOS stack, and the Ruby line (see tools: below)
    # aligned. Bump them together — android -> 2026 edition, macOS -> Xcode 27,
    # Ruby -> the next line both stacks preinstall — so every workflow keeps
    # pulling a preinstalled Ruby and builds stay fast.
    stack: &android_stack ubuntu-noble-24.04-bitrise-2025-android
    machine_type_id: g2.linux.medium

app:
  envs:
    # One device for every macOS job. GitHub Actions grew two values by accident
    # (iPhone 17 Pro for Swift, iPhone 16 Pro for React Native); the port keeps a
    # single one so a runtime change cannot break half the jobs.
    - CI_IOS_SIMULATOR_DEVICE: iPhone 17 Pro
    - E2E_ANDROID_DEVICE_OVERRIDE: Google Pixel 9-17.0
    - E2E_IOS_DEVICE_OVERRIDE: iPhone 15-27 Beta
    - E2E_BROWSERSTACK_API_RETRIES: "1"
    - E2E_BROWSERSTACK_TIMEOUT_SECONDS: "1800"
    - E2E_BROWSERSTACK_POLL_SECONDS: "30"

tools:
  # "3.4:installed" tells each pinned stack to use its own preinstalled 3.4.x
  # (no ~3-min source compile). Local dev and GitHub Actions pin the exact patch
  # via the repo-root .ruby-version (3.4.8). The patch level and the interpreter
  # path a stack serves both move when its image is refreshed, so nothing may
  # assume a fixed Ruby here — see install-ruby-gems for why the gem cache is
  # keyed on the interpreter.
  # When bumping stacks (see meta.bitrise.io above), move this line to the next
  # Ruby both stacks preinstall so all workflows stay on a preinstalled version.
  ruby: 3.4:installed
  nodejs: 22.14.0

pipelines:
  e2e:
    triggers:
      pull_request:
        - source_branch: "*"
          draft_enabled: false
          changed_files:
            # Bitrise evaluates this with Go's RE2 engine. Use only basic syntax
            # (anchors, groups, alternation, character classes, quantifiers). Do not
            # add lookahead (?=…), lookbehind, backreferences (\1), or atomic/possessive
            # groups — RE2 cannot compile them and the trigger will fail to evaluate.
            regex: '^(platforms/(swift|android|react-native)|protocol|e2e|\.ci)/.*|^Package\.(swift|resolved)$'
    # Bitrise's default report name is ci/bitrise/<project_slug>/<event_type>,
    # which is identical for every pipeline on this app. A second triggered
    # pipeline would then overwrite this one's commit status. <target_id>
    # expands to the pipeline id, so each pipeline owns its own check.
    status_report_name: "ci/bitrise/<target_id>/<event_type>"
    workflows:
      e2e-produce-browserstack-run-plan: {}
      e2e-build-react-native-ios:
        run_if:
          expression: '{{ enveq "E2E_BUILD_REACT_NATIVE_IOS" "true" }}'
        depends_on:
          - e2e-produce-browserstack-run-plan
      e2e-build-react-native-android:
        run_if:
          expression: '{{ enveq "E2E_BUILD_REACT_NATIVE_ANDROID" "true" }}'
        depends_on:
          - e2e-produce-browserstack-run-plan
      e2e-build-kotlin-android:
        run_if:
          expression: '{{ enveq "E2E_BUILD_KOTLIN_ANDROID" "true" }}'
        depends_on:
          - e2e-produce-browserstack-run-plan
      e2e-build-swift-ios:
        run_if:
          expression: '{{ enveq "E2E_BUILD_SWIFT_IOS" "true" }}'
        depends_on:
          - e2e-produce-browserstack-run-plan
      e2e-execute-browserstack-run:
        run_if:
          expression: '{{ enveq "E2E_HAS_E2E_RUNS" "true" }}'
        depends_on:
          - e2e-produce-browserstack-run-plan
          - e2e-build-react-native-ios
          - e2e-build-react-native-android
          - e2e-build-kotlin-android
          - e2e-build-swift-ios
        parallel: $E2E_BROWSERSTACK_RUN_PLAN_PARALLEL_COUNT
      e2e-report:
        run_if:
          expression: '{{ enveq "E2E_HAS_E2E_RUNS" "true" }}'
        depends_on:
          - e2e-execute-browserstack-run
        should_always_run: workflow

  # The macOS merge gate. Separate from the e2e pipeline on purpose: Bitrise reports one
  # status per pipeline, and sharing would tie the merge gate to the BrowserStack device
  # flake that e2e/BITRISE.md deliberately keeps non-blocking.
  ci-ios:
    # Deliberately unfiltered. ci-ios is a required check, and a required check that
    # never posts leaves a pull request permanently unmergeable. The cheap Linux
    # ci-ios-plan workflow decides which macOS jobs run, and ci-ios-report always posts
    # — including for a change that needs no macOS job at all.
    triggers:
      pull_request:
        - source_branch: "*"
          draft_enabled: false
    status_report_name: "ci/bitrise/<target_id>/<event_type>"
    workflows:
      ci-ios-plan: {}
      ci-ios-swift-package-tests:
        run_if:
          expression: '{{ enveq "CI_IOS_SWIFT_PACKAGE_TESTS" "true" }}'
        depends_on:
          - ci-ios-plan
      ci-ios-swift-samples:
        run_if:
          expression: '{{ enveq "CI_IOS_SWIFT_SAMPLES" "true" }}'
        depends_on:
          - ci-ios-plan
      ci-ios-react-native-build-ios:
        run_if:
          expression: '{{ enveq "CI_IOS_REACT_NATIVE_BUILD_IOS" "true" }}'
        depends_on:
          - ci-ios-plan
      ci-ios-react-native-test-ios:
        run_if:
          expression: '{{ enveq "CI_IOS_REACT_NATIVE_TEST_IOS" "true" }}'
        depends_on:
          - ci-ios-plan
      # No run_if: this workflow is the required check, so it posts on every build,
      # including one where ci-ios-plan selected nothing and every job was skipped.
      ci-ios-report:
        depends_on:
          - ci-ios-swift-package-tests
          - ci-ios-swift-samples
          - ci-ios-react-native-build-ios
          - ci-ios-react-native-test-ios
        should_always_run: workflow

  # Deliberately has no target-based triggers. A scheduled build in the Bitrise UI
  # is the only automatic start, alongside a manual start or the API.
  nightly-swift-ios-testflight:
    workflows:
      nightly-decide-should-build: {}
      nightly-release-swift-ios:
        run_if:
          expression: '{{ enveq "NIGHTLY_SHOULD_BUILD" "true" }}'
        depends_on:
          - nightly-decide-should-build

  nightly-react-native-ios-testflight:
    workflows:
      nightly-decide-should-build: {}
      nightly-release-react-native-ios:
        run_if:
          expression: '{{ enveq "NIGHTLY_SHOULD_BUILD" "true" }}'
        depends_on:
          - nightly-decide-should-build

step_bundles:
  install-node-modules:
    steps:
      - restore-cache@3:
          inputs:
            - key: &rn_node_modules_cache_key |-
                rn-node-modules-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/react-native/pnpm-lock.yaml" }}
      - script@1:
          title: Install React Native dependencies
          inputs:
            - content: |-
                set -euo pipefail
                source e2e/scripts/bitrise_ci_helpers
                e2e_enable_corepack
                cd platforms/react-native
                pnpm install --frozen-lockfile
      - save-cache@1:
          inputs:
            - key: *rn_node_modules_cache_key
            - paths: platforms/react-native/node_modules
  install-ruby-gems:
    steps:
      - script@1:
          title: Fingerprint Ruby for the gem cache key
          inputs:
            - content: |-
                set -euo pipefail
                # The bundle is built with BUNDLE_FORCE_RUBY_PLATFORM, so gems like
                # bigdecimal and ffi are compiled from source and bake the absolute
                # path of libruby into their .bundle/.so. The stacks serve Ruby out
                # of the nix store, and that path changes whenever a stack image is
                # refreshed even when the version string does not. Without the
                # interpreter in the cache key, a bundle compiled against the old
                # Ruby is restored onto the new one and every native gem fails to
                # dlopen, which takes down `pod install` before it does any work.
                ruby -rrbconfig -e 'puts [RbConfig::CONFIG["prefix"], RUBY_VERSION, RUBY_PLATFORM]' > .ruby-cache-fingerprint
                cat .ruby-cache-fingerprint
      - restore-cache@3:
          inputs:
            - key: &rn_ruby_gems_cache_key |-
                rn-ruby-gems-{{ .OS }}-{{ .Arch }}-{{ checksum ".ruby-cache-fingerprint" }}-{{ checksum "platforms/react-native/sample/Gemfile.lock" }}
      - script@1:
          title: Install iOS Ruby dependencies
          inputs:
            - content: |-
                set -euo pipefail
                cd platforms/react-native/sample
                bundle install
      - save-cache@1:
          inputs:
            - key: *rn_ruby_gems_cache_key
            - paths: platforms/react-native/sample/vendor/bundle
  install-cocoapods:
    steps:
      - restore-cache@3:
          inputs:
            - key: &rn_cocoapods_cache_key |-
                rn-cocoapods-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/react-native/sample/ios/Podfile.lock" }}
      - script@1:
          title: Install CocoaPods dependencies
          inputs:
            - content: |-
                set -euo pipefail
                cd platforms/react-native/sample/ios
                bundle exec pod install --deployment
      - save-cache@1:
          inputs:
            - key: *rn_cocoapods_cache_key
            - paths: platforms/react-native/sample/ios/Pods
  # xcodebuild spends the first minute of a test run waiting for a cold simulator to
  # finish booting. Booting it up front with `bootstatus -b` moves that wait out of the
  # measured build step and fails loudly when the runtime is missing from the stack.
  create-ios-simulator:
    steps:
      - script@1:
          title: Create and boot the iOS simulator
          inputs:
            - content: |-
                set -euo pipefail
                : "${CI_IOS_SIMULATOR_DEVICE:?CI_IOS_SIMULATOR_DEVICE is required}"
                xcrun simctl delete all
                simulator_uuid="$(xcrun simctl create CIDevice "$CI_IOS_SIMULATOR_DEVICE")"
                xcrun simctl bootstatus "$simulator_uuid" -b
                envman add --key CURRENT_SIMULATOR_UUID --value "$simulator_uuid"
  install-sccache:
    steps:
      - script@1:
          title: Install sccache
          inputs:
            - content: |-
                set -euo pipefail
                if ! command -v sccache >/dev/null 2>&1; then
                  brew install sccache
                fi
                sccache --version
  restore-sccache:
    inputs:
      - cache_namespace: ""
    steps:
      - script@1:
          title: Configure sccache cache keys
          inputs:
            - content: |-
                set -euo pipefail
                : "${cache_namespace:?cache_namespace input is required}"
                : "${BITRISE_GIT_BRANCH:?BITRISE_GIT_BRANCH is required}"
                : "${BITRISE_GIT_COMMIT:?BITRISE_GIT_COMMIT is required}"
                cache_os="$(uname -s | tr '[:upper:]' '[:lower:]')"
                cache_arch="$(uname -m)"
                cache_prefix="${cache_namespace}-sccache-${cache_os}-${cache_arch}"
                cache_key="${cache_prefix}-${BITRISE_GIT_BRANCH}-${BITRISE_GIT_COMMIT}"
                cache_restore_keys="$(printf '%s\n%s\n%s' "$cache_key" "${cache_prefix}-${BITRISE_GIT_BRANCH}-" "${cache_prefix}-")"
                envman add --key SCCACHE_CACHE_KEY --value "$cache_key"
                envman add --key SCCACHE_RESTORE_KEYS --value "$cache_restore_keys"
      - restore-cache@3:
          inputs:
            - key: $SCCACHE_RESTORE_KEYS
  save-sccache:
    steps:
      - script@1:
          title: Validate sccache cache configuration
          inputs:
            - content: |-
                set -euo pipefail
                : "${SCCACHE_CACHE_KEY:?restore-sccache must run before save-sccache}"
                : "${SCCACHE_DIR:?SCCACHE_DIR is required}"
      - save-cache@1:
          inputs:
            - key: $SCCACHE_CACHE_KEY
            - paths: $SCCACHE_DIR
  bootstrap-mint:
    inputs:
      - mintfile_dir: ""
    steps:
      - restore-cache@3:
          inputs:
            - key: &mint_cache_key |-
                mint-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/swift/Mintfile" }}
      - script@1:
          title: Bootstrap Mint dependencies
          inputs:
            - content: |-
                set -euo pipefail
                : "${mintfile_dir:?mintfile_dir input is required}"
                if ! command -v mint >/dev/null 2>&1; then
                  brew install mint
                fi
                cd "$mintfile_dir"
                mint bootstrap
      - save-cache@1:
          inputs:
            - key: *mint_cache_key
            - paths: ~/.mint

workflows:
  # Runs on the cheap default Linux stack. Every macOS machine this pipeline boots is
  # decided here, so a change that needs no iOS job costs one short Linux build.
  ci-ios-plan:
    steps:
      - git-clone@8: {}
      - script@1:
          title: Decide which iOS jobs run
          timeout: 900
          no_output_timeout: 450
          inputs:
            - content: |-
                set -euo pipefail
                source e2e/scripts/bitrise_ci_helpers
                e2e_log "Fetching pull request changed files"
                changed_files="$(e2e_changed_files_file)"
                ruby e2e/scripts/ios_ci_run_plan validate --changed-files-file "$changed_files"
                e2e_log "Asserting the pipeline can run every selected job"
                branch_config="$(e2e_branch_bitrise_config)"
                ruby e2e/scripts/ios_ci_run_plan assert-pipeline-coverage --pipeline-config "$branch_config" --changed-files-file "$changed_files"
                e2e_log "Publishing iOS CI job flags"
                bitrise_env_file="$(e2e_deploy_dir)/ios-ci-env.txt"
                ruby e2e/scripts/ios_ci_run_plan bitrise-env --changed-files-file "$changed_files" > "$bitrise_env_file"
                cat "$bitrise_env_file"
                while IFS='=' read -r key value; do
                  envman add --key "$key" --value "$value"
                done < "$bitrise_env_file"
      - share-pipeline-variable@1:
          inputs:
            - variables: |-
                CI_IOS_HAS_JOBS
                CI_IOS_SELECTED_JOBS
                CI_IOS_SWIFT_PACKAGE_TESTS
                CI_IOS_SWIFT_SAMPLES
                CI_IOS_REACT_NATIVE_BUILD_IOS
                CI_IOS_REACT_NATIVE_TEST_IOS

  ci-ios-swift-package-tests:
    meta:
      bitrise.io:
        # Keep in sync with dev.yml's xcode.version (26.2). Bitrise stable stacks
        # only receive Xcode patch updates, so this pins Xcode 26.2 / iOS 26.2
        # (23C54) to match local development.
        stack: &macos_stack osx-xcode-26.2.x
        machine_type_id: g2.mac.large
    steps:
      - git-clone@8: {}
      - bundle::create-ios-simulator: {}
      - script@1:
          title: Run Swift package tests
          timeout: 3600
          no_output_timeout: 1800
          inputs:
            - content: |-
                set -euo pipefail
                cd platforms/swift
                ./Scripts/xcode_run test ShopifyCheckoutKit-Package

  ci-ios-swift-samples:
    meta:
      bitrise.io:
        stack: *macos_stack
        machine_type_id: g2.mac.large
    steps:
      - git-clone@8: {}
      - bundle::create-ios-simulator: {}
      - bundle::bootstrap-mint:
          inputs:
            - mintfile_dir: platforms/swift
      # Both samples build the root package and Apollo iOS from source. Neither changes
      # between most pull requests, so DerivedData carries that work across builds. The key
      # holds the resolved dependency graph: a pin change rebuilds rather than reuses.
      # Xcode's incremental build owns correctness for the source that did change.
      - restore-cache@3:
          inputs:
            - key: &swift_samples_derived_data_cache_key |-
                swift-samples-derived-data-{{ .OS }}-{{ .Arch }}-{{ checksum "Package.resolved" }}
      - script@1:
          title: Build and test the Swift sample apps
          timeout: 5400
          no_output_timeout: 1800
          inputs:
            - content: |-
                set -euo pipefail
                # The samples only need a well-formed storefront configuration to compile,
                # so this job runs on placeholders rather than e2e_configure_storefront,
                # which asserts the real secrets. Keeping it off them is what lets the job
                # run on fork pull requests, where Bitrise withholds secrets.
                export STOREFRONT_DOMAIN="${STOREFRONT_DOMAIN:-example.myshopify.com}"
                export STOREFRONT_ACCESS_TOKEN="${STOREFRONT_ACCESS_TOKEN:-test-token}"
                ./scripts/setup_storefront_env
                cd platforms/swift
                ./Scripts/build_and_test_samples
      - save-cache@1:
          inputs:
            - key: *swift_samples_derived_data_cache_key
            - paths: ~/Library/Developer/Xcode/DerivedData

  ci-ios-react-native-build-ios:
    meta:
      bitrise.io:
        stack: *macos_stack
        machine_type_id: g2.mac.4large
    envs:
      - SCCACHE_ENABLED: "1"
      - SCCACHE_DIR: $BITRISE_SOURCE_DIR/.sccache
    steps:
      - git-clone@8: {}
      - bundle::create-ios-simulator: {}
      - script@1:
          title: Verify the sample lockfile resolves the published native SDK
          timeout: 300
          no_output_timeout: 150
          inputs:
            - content: |-
                set -euo pipefail
                # Runs before pod install: --deployment would also catch a local-path
                # lockfile, but only as an opaque diff. This names the problem.
                cd platforms/react-native
                scripts/check_published_podfile_lock sample/ios/Podfile.lock
      - bundle::install-node-modules: {}
      - bundle::install-ruby-gems: {}
      - bundle::install-sccache: {}
      - bundle::install-cocoapods: {}
      # The 89 pods here are the React Native New Architecture C++ core. They dominate the
      # build and only change when the lockfile or the Swift package pins do.
      - restore-cache@3:
          inputs:
            - key: &rn_sample_derived_data_cache_key |-
                rn-sample-derived-data-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/react-native/sample/ios/Podfile.lock" }}-{{ checksum "Package.resolved" }}
      - bundle::restore-sccache:
          inputs:
            - cache_namespace: rn-sample
      - script@1:
          title: Build the React Native iOS sample
          timeout: 5400
          no_output_timeout: 1800
          inputs:
            - content: |-
                set -euo pipefail
                cd platforms/react-native
                pnpm module build
                pnpm sample build:ios
                sccache --show-stats
      - save-cache@1:
          inputs:
            - key: *rn_sample_derived_data_cache_key
            - paths: ~/Library/Developer/Xcode/DerivedData
      - bundle::save-sccache: {}

  ci-ios-react-native-test-ios:
    meta:
      bitrise.io:
        stack: *macos_stack
        machine_type_id: g2.mac.4large
    envs:
      - SCCACHE_ENABLED: "1"
      - SCCACHE_DIR: $BITRISE_SOURCE_DIR/.sccache
    steps:
      - git-clone@8: {}
      - bundle::create-ios-simulator: {}
      - script@1:
          title: Verify the integration app lockfile resolves the published native SDK
          timeout: 300
          no_output_timeout: 150
          inputs:
            - content: |-
                set -euo pipefail
                cd platforms/react-native
                scripts/check_published_podfile_lock test/rct-integration-app/Podfile.lock
      - bundle::install-node-modules: {}
      - bundle::install-ruby-gems: {}
      # xcodegen generates the integration app's project from project.yml.
      - bundle::bootstrap-mint:
          inputs:
            - mintfile_dir: platforms/swift
      # Not the install-cocoapods bundle: that one owns the sample app's Pods tree.
      # test_ios runs `pod install` for the integration app itself, so this pair only
      # carries the resulting Pods directory across builds.
      - bundle::install-sccache: {}
      - restore-cache@3:
          inputs:
            - key: &rct_integration_cocoapods_cache_key |-
                rct-integration-cocoapods-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/react-native/test/rct-integration-app/Podfile.lock" }}
      - bundle::restore-sccache:
          inputs:
            - cache_namespace: rct-integration
      - script@1:
          title: Run the React Native iOS tests
          timeout: 5400
          no_output_timeout: 1800
          inputs:
            - content: |-
                set -euo pipefail
                cd platforms/react-native
                pnpm module build
                pnpm sample test:ios
                sccache --show-stats
      - save-cache@1:
          inputs:
            - key: *rct_integration_cocoapods_cache_key
            - paths: platforms/react-native/test/rct-integration-app/Pods
      - bundle::save-sccache: {}

  ci-ios-report:
    steps:
      - git-clone@8: {}
      - script@1:
          title: Report iOS CI results to GitHub
          timeout: 900
          no_output_timeout: 450
          inputs:
            - content: |-
                set -euo pipefail
                source e2e/scripts/bitrise_ci_helpers
                e2e_export_github_token
                : "${BITRISE_GIT_COMMIT:?BITRISE_GIT_COMMIT is required}"
                # The report names the stages that failed from this roster. Bitrise documents no
                # enum for its status field, so log the payload to confirm the literals it uses.
                e2e_log "Pipeline stage roster"
                printf '%s\n' "${BITRISEIO_FINISHED_WORKFLOWS:-<unset>}"
                e2e_log "Reporting iOS CI results to GitHub"
                ruby e2e/scripts/report_ios_ci_results

  e2e-produce-browserstack-run-plan:
    steps:
      - git-clone@8: {}
      - script@1:
          title: Produce BrowserStack run plan
          timeout: 1800
          no_output_timeout: 900
          inputs:
            - content: |-
                set -euo pipefail
                source e2e/scripts/bitrise_ci_helpers
                e2e_log "Fetching pull request changed files"
                changed_files="$(e2e_changed_files_file)"
                ruby e2e/scripts/e2e_matrix_to_browserstack_run_plan validate --changed-files-file "$changed_files"
                e2e_log "Asserting the pipeline can build every selected target"
                branch_config="$(e2e_branch_bitrise_config)"
                ruby e2e/scripts/e2e_matrix_to_browserstack_run_plan assert-pipeline-coverage --pipeline-config "$branch_config" --changed-files-file "$changed_files"
                e2e_log "Producing BrowserStack run plan"
                ruby e2e/scripts/e2e_matrix_to_browserstack_run_plan expand --changed-files-file "$changed_files" > "$BITRISE_DEPLOY_DIR/browserstack-run-plan.json"
                e2e_log "Publishing BrowserStack run plan environment"
                bitrise_env_file="$(e2e_deploy_dir)/bitrise-env.txt"
                ruby e2e/scripts/e2e_matrix_to_browserstack_run_plan bitrise-env --changed-files-file "$changed_files" > "$bitrise_env_file"
                while IFS='=' read -r key value; do
                  envman add --key "$key" --value "$value"
                done < "$bitrise_env_file"
                e2e_log "Zipping E2E tests"
                tests_zip="$(e2e_deploy_dir)/e2e-tests.zip"
                e2e/scripts/zip_e2e_tests --output "$tests_zip"
                e2e_log "Publishing E2E tests zip path"
                envman add --key E2E_TESTS_ZIP --value "$tests_zip"
      - share-pipeline-variable@1:
          inputs:
            - variables: |-
                E2E_BROWSERSTACK_RUN_PLAN_COUNT
                E2E_BROWSERSTACK_RUN_PLAN_PARALLEL_COUNT
                E2E_HAS_E2E_RUNS
                E2E_BUILD_REACT_NATIVE_IOS
                E2E_BUILD_REACT_NATIVE_ANDROID
                E2E_BUILD_KOTLIN_ANDROID
                E2E_BUILD_SWIFT_IOS
      - deploy-to-bitrise-io@2:
          is_always_run: false
          inputs:
            - pipeline_intermediate_files: |-
                $E2E_TESTS_ZIP:E2E_TESTS_ZIP
                $BITRISE_DEPLOY_DIR/browserstack-run-plan.json:E2E_BROWSERSTACK_RUN_PLAN_JSON

  e2e-build-react-native-ios:
    meta:
      bitrise.io:
        stack: *macos_stack
        machine_type_id: g2.mac.4large
    steps:
      - git-clone@8: {}
      - certificate-and-profile-installer@1: {}
      - bundle::install-node-modules: {}
      - bundle::install-ruby-gems: {}
      - bundle::install-cocoapods: {}
      - script@1:
          title: Build React Native iOS IPA artifact
          timeout: 5400
          no_output_timeout: 1800
          inputs:
            - content: |-
                set -euo pipefail
                e2e/scripts/build_react_native_ios
      - deploy-to-bitrise-io@2:
          is_always_run: false
          inputs:
            - pipeline_intermediate_files: |-
                $E2E_REACT_NATIVE_IOS_APP_PATH:E2E_REACT_NATIVE_IOS_APP_PATH
                $E2E_REACT_NATIVE_IOS_SIMULATOR_APP_PATH:E2E_REACT_NATIVE_IOS_SIMULATOR_APP_PATH

  e2e-build-react-native-android:
    meta:
      bitrise.io:
        stack: *android_stack
        machine_type_id: g2.linux.large
    steps:
      - git-clone@8: {}
      - bundle::install-node-modules: {}
      - restore-cache@3:
          inputs:
            - key: &rn_gradle_cache_key |-
                rn-gradle-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/react-native/sample/android/**/*.gradle*" }}
      - script@1:
          title: Build React Native Android APK artifact
          timeout: 3600
          no_output_timeout: 1800
          inputs:
            - content: |-
                set -euo pipefail
                e2e/scripts/build_react_native_android
      - deploy-to-bitrise-io@2:
          inputs:
            - pipeline_intermediate_files: |-
                $E2E_REACT_NATIVE_ANDROID_APP_PATH:E2E_REACT_NATIVE_ANDROID_APP_PATH
      - save-cache@1:
          inputs:
            - key: *rn_gradle_cache_key
            - paths: |-
                ~/.gradle/caches
                ~/.gradle/wrapper

  e2e-build-kotlin-android:
    meta:
      bitrise.io:
        stack: *android_stack
        machine_type_id: g2.linux.large
    steps:
      - git-clone@8: {}
      - restore-cache@3:
          inputs:
            - key: &kotlin_gradle_cache_key |-
                kotlin-gradle-{{ .OS }}-{{ .Arch }}-{{ checksum "platforms/android/samples/CheckoutKitAndroidDemo/**/*.gradle*" }}
      - script@1:
