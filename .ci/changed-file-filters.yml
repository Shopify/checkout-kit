# Shared changed-file filters for workflows and pipelines that should ignore docs-only changes.
# Negative patterns need `predicate-quantifier: every` in dorny/paths-filter workflow steps.
android:
  - 'platforms/android/**'
  - &exclude-markdown '!**/*.md'
  - &exclude-docs-directory '!**/docs/**'
swift:
  - 'platforms/swift/**'
  - *exclude-markdown
  - *exclude-docs-directory
reactNative:
  - 'platforms/react-native/**'
  - *exclude-markdown
  - *exclude-docs-directory
web:
  - 'platforms/web/**'
  - *exclude-markdown
  - *exclude-docs-directory
protocol:
  - 'protocol/**'
  - *exclude-markdown
  - *exclude-docs-directory
# Protocol files outside language bindings can change every language binding,
# including shared code-generation tooling. This filter uses one inclusive
# pattern because GitHub Actions evaluates these patterns with
# `predicate-quantifier: every`.
protocolShared:
  - 'protocol/**'
  - '!protocol/languages/**'
  - *exclude-markdown
  - *exclude-docs-directory
protocolTypescript:
  - 'protocol/languages/typescript/**'
  - *exclude-markdown
  - *exclude-docs-directory
protocolSwift:
  - 'protocol/languages/swift/**'
  - *exclude-markdown
  - *exclude-docs-directory
protocolKotlin:
  - 'protocol/languages/kotlin/**'
  - *exclude-markdown
  - *exclude-docs-directory
packageSwift:
  - 'Package.swift'
  - 'Package.resolved'
e2e:
  - 'e2e/**'
  - *exclude-markdown
  - *exclude-docs-directory
ciFilters:
  - '.ci/changed-file-filters.yml'
# The macOS CI gate on Bitrise. Narrower than the e2e filter on purpose: these files
# decide which macOS jobs run, so a change to one has to rerun them all, while a Maestro
# flow edit under e2e/ must not.
iosCiConfig:
  - 'e2e/bitrise.yml'
  - 'e2e/config/ios_ci.yml'
  - 'e2e/lib/ios_ci_run_plan.rb'
  - 'e2e/lib/ios_ci_reporter.rb'
  - 'e2e/scripts/ios_ci_run_plan'
  - 'e2e/scripts/report_ios_ci_results'
  - 'e2e/scripts/bitrise_ci_helpers'
