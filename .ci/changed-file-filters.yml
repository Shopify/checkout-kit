# Shared changed-file filters for workflows and pipelines that should ignore docs-only changes.
# Use `predicate-quantifier: some-with-excludes` in dorny/paths-filter workflow steps.
# Like scripts/lib/changed_file_filters.rb, match any inclusion and reject any exclusion.
android:
  - 'platforms/android/**'
  - &exclude-markdown '!**/*.md'
  - &exclude-docs-directory '!**/docs/**'
swift:
  - 'platforms/swift/**'
  - *exclude-markdown
  - *exclude-docs-directory
reactNative:
  - 'platforms/react-native/**'
  - *exclude-markdown
  - *exclude-docs-directory
web:
  - 'platforms/web/**'
  - 'platforms/web/internal/telemetry/**'
  - 'platforms/shared/telemetry/contract/**'
  - *exclude-markdown
  - *exclude-docs-directory
# Markdown stays included here: the metrics contract is a markdown document
# and contract changes must run the telemetry checks.
telemetry:
  - 'platforms/shared/telemetry/**'
  - 'platforms/swift/Sources/Internal/Telemetry/**'
  - 'platforms/swift/Tests/Internal/CheckoutKitTelemetryTests/**'
  - 'platforms/web/internal/telemetry/**'
  - 'platforms/android/shopify-checkout-kit/src/main/java/com/shopify/checkoutkit/telemetry/**'
  - 'platforms/android/shopify-checkout-kit/src/test/java/com/shopify/checkoutkit/telemetry/**'
  - *exclude-docs-directory
protocol:
  - 'protocols/universal-commerce-protocol/embedded-checkout-protocol/**'
  - *exclude-markdown
  - *exclude-docs-directory
# Protocol files outside language bindings can change every language binding,
# including shared code-generation tooling. Language bindings are matched separately.
protocolShared:
  - 'protocols/universal-commerce-protocol/embedded-checkout-protocol/**'
  - '!protocols/universal-commerce-protocol/embedded-checkout-protocol/languages/**'
  - *exclude-markdown
  - *exclude-docs-directory
protocolTypescript:
  - 'protocols/universal-commerce-protocol/embedded-checkout-protocol/languages/typescript/**'
  - *exclude-markdown
  - *exclude-docs-directory
protocolSwift:
  - 'protocols/universal-commerce-protocol/embedded-checkout-protocol/languages/swift/**'
  - *exclude-markdown
  - *exclude-docs-directory
protocolKotlin:
  - 'protocols/universal-commerce-protocol/embedded-checkout-protocol/languages/kotlin/**'
  - *exclude-markdown
  - *exclude-docs-directory
packageSwift:
  - 'Package.swift'
  - 'Package.resolved'
e2e:
  - 'e2e/**'
  - *exclude-markdown
  - *exclude-docs-directory
ciFilters:
  - '.ci/changed-file-filters.yml'
# The macOS CI gate on Bitrise. Narrower than the e2e filter on purpose: these files
# decide which macOS jobs run, so a change to one has to rerun them all, while a Maestro
# flow edit under e2e/ must not.
iosCiConfig:
  - 'e2e/bitrise.yml'
  - 'e2e/config/ios_ci.yml'
  - 'e2e/lib/ios_ci_run_plan.rb'
  - 'e2e/lib/ios_ci_reporter.rb'
  - 'e2e/scripts/ios_ci_run_plan'
  - 'e2e/scripts/report_ios_ci_results'
  - 'e2e/scripts/bitrise_ci_helpers'
