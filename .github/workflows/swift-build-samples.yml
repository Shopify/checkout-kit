name: Swift — Build Sample Apps

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-samples:
    uses: ./.github/workflows/swift-test-workflow.yml
    with:
      test-path: ./Scripts/build_samples
      job-name: Build Sample Apps
      setup-storefront-env: true
      artifact-name: swift-sample-builds-xcresult
