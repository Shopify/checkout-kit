name: Swift — Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cocoapods:
    # Only run for Swift releases. Swift owns the bare-semver tag namespace
    # (`X.Y.Z`); other platforms use a slash-prefixed namespace
    # (`android/X.Y.Z`, `web/X.Y.Z`, etc.). Filtering on "no slash" means this
    # workflow doesn't need updating each time a new platform namespace lands.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.release.tag_name, '/') }}
    runs-on: ${{ vars.MACOS_RUNNER }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/platforms/swift/Gemfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag matches Swift versions
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          .github/scripts/validate-release-version iOS "" "$TAG"

      - uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1.317.0
        with:
          bundler-cache: true
          working-directory: platforms/swift

      - name: Deploy to Cocoapods
        # Podspec lives at the repo root; lint and trunk push run from there.
        run: |
          set -eo pipefail
          bundle exec pod lib lint ShopifyCheckoutKit.podspec --allow-warnings --verbose
          bundle exec pod trunk push ShopifyCheckoutKit.podspec --allow-warnings --verbose
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
