name: Android — Lint, Build & Run Tests

on:
  workflow_call:
    inputs:
      ready:
        description: When false, skip non-draft-only jobs (the sample app build).
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ready:
        description: When false, skip non-draft-only jobs (the sample app build).
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Install JDK 1.17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 17
          cache: 'gradle'

      - name: Run Tests
        run: ./gradlew test --console=plain

  build:
    # Sample app build is deferred to non-draft PRs.
    if: ${{ inputs.ready }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Install JDK 1.17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 17
          cache: 'gradle'

      - name: Setup sample app environment
        run: ${{ github.workspace }}/scripts/setup_storefront_env --skip-optional-prompts
        env:
          STOREFRONT_DOMAIN: example.myshopify.com
          STOREFRONT_ACCESS_TOKEN: test-token

      - name: Build Sample App
        run: ./gradlew assembleDebug
        working-directory: platforms/android/samples/CheckoutKitAndroidDemo

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Install JDK 1.17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 17
          cache: 'gradle'

      - name: Kotlin Lint
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew lintRelease
