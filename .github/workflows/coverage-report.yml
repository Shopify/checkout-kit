name: Coverage Report

on:
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request to refresh
        required: true
        type: number

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      # This publisher only executes trusted default-branch code. PR jobs supply
      # numeric coverage data through check runs, never executable report code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: resolve
        with:
          script: |
            const {resolvePR} = require('./.github/scripts/publish-coverage.cjs');
            const pr = await resolvePR({github, context});
            if (pr) core.setOutput('pr', pr);

  publish:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: write
    concurrency:
      group: coverage-comment-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
        with:
          script: |
            const {publish} = require('./.github/scripts/publish-coverage.cjs');
            await publish({github, context, core, prNumber: Number(process.env.PR_NUMBER)});
