name: Swift — Run Package Tests

on:
  push:
    branches:
      - main
    paths:
      - 'swift/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/swift-test-package.yml'
      - '.github/workflows/swift-test-workflow.yml'
  pull_request:
    paths:
      - 'swift/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/swift-test-package.yml'
      - '.github/workflows/swift-test-workflow.yml'
  workflow_dispatch:

jobs:
  call-workflow-passing-data:
    uses: ./.github/workflows/swift-test-workflow.yml
    with:
      test-path: ./Scripts/xcode_run test ShopifyCheckoutSheetKit-Package
