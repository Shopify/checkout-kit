name: React Native — Run Android Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '22'

jobs:
  test-android:
    name: Run Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platforms/react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/package.json
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Install JDK
        id: setup-java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            platforms/android/**/*.gradle*
            platforms/android/**/gradle-wrapper.properties
            platforms/android/gradle.properties
            protocol/languages/kotlin/**/*.gradle*
            protocol/languages/kotlin/**/*.toml
            platforms/react-native/package.json
            platforms/react-native/pnpm-lock.yaml
            platforms/react-native/sample/package.json
            platforms/react-native/sample/android/**/*.gradle*
            platforms/react-native/sample/android/**/gradle-wrapper.properties
            platforms/react-native/sample/android/gradle.properties
            platforms/react-native/modules/@shopify/checkout-kit-react-native/android/**/*.gradle*
            platforms/react-native/modules/@shopify/checkout-kit-react-native/android/gradle.properties

      - name: Setup Android NDK
        timeout-minutes: 10
        uses: ./.github/actions/setup-android-ndk

      - name: Run Android tests
        timeout-minutes: 20
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=768m
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
          STOREFRONT_DOMAIN: example.myshopify.com
          STOREFRONT_ACCESS_TOKEN: test-token
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          javac -version
          ${{ github.workspace }}/scripts/setup_storefront_env --skip-optional-prompts
          pnpm module build
          pnpm sample test:android --no-daemon
