name: Web

on:
  workflow_call:
  workflow_dispatch:

jobs:
  ci:
    name: Lint, test, build, verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: platforms/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/web/package.json
          cache-dependency-path: platforms/web/pnpm-lock.yaml
          package-json-file: platforms/web/package.json
          working-directory: platforms/web

      - name: Lint (typecheck + oxlint + oxfmt --check)
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@642ef024cc554a34b7082cea12c7bf63575ae151 # main
        with:
          coverage-summary-path: platforms/web/coverage/coverage-summary.json
          title: 'Web — Coverage Report'
          unique-id-for-comment: web
          create-new-comment: false

      - name: Build
        run: pnpm build

      - name: Typecheck web E2E tests
        run: pnpm --dir ../../e2e/web typecheck

      - name: Install Playwright Chromium
        run: pnpm --dir ../../e2e/web exec playwright install --with-deps chromium

      - name: Web browser happy path
        run: pnpm --dir ../../e2e/web test

      - name: Upload browser test report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-playwright
          path: |
            e2e/web/playwright-report/
            e2e/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify package (publint)
        run: pnpm verify

      - name: Build sample app
        run: pnpm sample:build

      - name: Compare packed-files snapshot
        run: pnpm compare-snapshot
