name: Web

on:
  workflow_call:
  workflow_dispatch:

jobs:
  ci:
    name: Lint, test, build, verify
    runs-on: ubuntu-latest
    # A cache miss downloads Chromium; leave enough time for a cold runner to populate the cache.
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: read
    defaults:
      run:
        working-directory: platforms/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/web/package.json
          cache-dependency-path: platforms/web/pnpm-lock.yaml
          package-json-file: platforms/web/package.json
          working-directory: platforms/web

      - name: Lint (typecheck + browser compatibility + oxlint + oxfmt --check)
        run: pnpm lint

      - name: Test
        id: coverage_tests
        run: pnpm test

      - name: Record coverage
        if: ${{ !cancelled() }}
        uses: ./.github/actions/report-coverage
        with:
          platform: web
          report-path: platforms/web/coverage/coverage-summary.json
          report-directory: platforms/web/coverage
          outcome: ${{ steps.coverage_tests.outcome }}

      - name: Build
        run: pnpm build

      - name: Typecheck web E2E tests
        run: pnpm --dir test/e2e typecheck

      - name: Restore Playwright Chromium
        id: playwright-chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Playwright's default Linux browser cache. The lockfile determines the required browser revision.
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('platforms/web/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm --dir test/e2e exec playwright install --with-deps chromium

      - name: Web browser happy path
        run: pnpm --dir test/e2e test

      - name: Upload browser test report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright
          path: |
            platforms/web/test/e2e/playwright-report/
            platforms/web/test/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify package (publint)
        run: pnpm verify

      - name: Build sample app
        run: pnpm sample:build

      - name: Compare packed-files snapshot
        run: pnpm compare-snapshot
