name: Web — Bootstrap Publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the full pipeline + pack but skip the actual publish. Defaults to true; flip to false to actually publish."
        required: true
        type: boolean
        default: true
      tag:
        description: "Dist-tag for this publish. 'next' for prereleases (e.g. 4.0.0-alpha.1), 'latest' only for stable versions."
        required: true
        type: choice
        default: next
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: web-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Bootstrap publish @shopify/checkout-kit to npm
    # Refuse to run from anywhere but `main`
    if: github.ref == 'refs/heads/main'
    environment:
      name: npm-web
      url: https://www.npmjs.com/package/@shopify/checkout-kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platforms/web

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/web/package.json
          cache-dependency-path: platforms/web/pnpm-lock.yaml
          package-json-file: platforms/web/package.json
          working-directory: platforms/web
          ignore-scripts: "true"

      - name: Lint (typecheck + oxlint + format)
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package (publint)
        run: pnpm verify

      - name: Check license headers
        run: ./scripts/check_license_headers.rb

      - name: Pack and inspect contents
        run: |
          pnpm pack --pack-destination /tmp/web-bootstrap
          echo "Tarball contents:"
          tar -tzf /tmp/web-bootstrap/*.tgz | sort

      - name: Print publish plan
        env:
          DIST_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "::notice::Plan: publish @shopify/checkout-kit@${VERSION} with --tag ${DIST_TAG} (dry-run=${DRY_RUN})"

      # Fail fast with a clear error if the NPM_TOKEN secret is missing or
      # empty. Nothing about the token value is logged — only its presence
      # as a boolean.
      - name: Verify NPM_TOKEN is present
        if: ${{ !inputs.dry-run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing or empty. Add it in repo Settings → Secrets and variables → Actions before re-running."
            exit 1
          fi
          echo "::notice::NPM_TOKEN is present."

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: pnpm publish --no-git-checks --ignore-scripts --tag "$DIST_TAG" --access public
        env:
          DIST_TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run summary
        if: ${{ inputs.dry-run }}
        env:
          DIST_TAG: ${{ inputs.tag }}
        run: |
          echo "::notice::Dry-run requested — skipped npm publish."
          echo "Would have published with: --tag $DIST_TAG --access public"
