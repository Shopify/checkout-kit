name: Web API Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: web-api-comment-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # Only default-branch code receives comment permissions. PR artifacts are data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          API_WORKFLOW_FILES: ci.yml
        with:
          script: |
            const {publish} = require('./.github/scripts/web-api-report.cjs');
            await publish({github, context, core, workflowFiles: process.env.API_WORKFLOW_FILES.split(',')});
