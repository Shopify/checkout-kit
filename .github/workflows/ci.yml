name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # Draft PRs run a reduced suite: the fast ubuntu lint/test jobs. The
    # expensive macOS/simulator and sample-build jobs are gated to non-draft
    # PRs via the changes.ready output. ready_for_review promotes a draft to the
    # full suite; converted_to_draft re-runs the reduced suite and cancels any
    # in-progress full run for the same PR ref.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

# Default token permissions — dorny/paths-filter calls the PR Files API to
# compute the diff, which needs pull-requests: read. contents: read covers
# actions/checkout for both push and pull_request events.
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same ref (PR pushes, branch updates).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      # true for pushes and non-draft PRs; false for draft PRs. Gates the
      # expensive macOS/simulator and sample-build jobs off draft PRs.
      ready: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
      android: ${{ steps.platform.outputs.android == 'true' || steps.platform.outputs.protocol == 'true' || steps.infra.outputs.android == 'true' }}
      swift: ${{ steps.platform.outputs.swift == 'true' || steps.platform.outputs.protocol == 'true' || steps.infra.outputs.swift == 'true' }}
      reactNative: ${{ steps.platform.outputs.reactNative == 'true' || steps.platform.outputs.swift == 'true' || steps.platform.outputs.android == 'true' || steps.platform.outputs.protocol == 'true' || steps.infra.outputs.reactNativeCommon == 'true' || steps.infra.outputs.reactNativeIos == 'true' || steps.infra.outputs.reactNativeAndroid == 'true' }}
      reactNativeIos: ${{ steps.platform.outputs.reactNative == 'true' || steps.platform.outputs.swift == 'true' || steps.platform.outputs.protocol == 'true' || steps.infra.outputs.reactNativeCommon == 'true' || steps.infra.outputs.reactNativeIos == 'true' }}
      reactNativeAndroid: ${{ steps.platform.outputs.reactNative == 'true' || steps.platform.outputs.android == 'true' || steps.platform.outputs.protocol == 'true' || steps.infra.outputs.reactNativeCommon == 'true' || steps.infra.outputs.reactNativeAndroid == 'true' }}
      web: ${{ steps.platform.outputs.web == 'true' || steps.infra.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: platform
        with:
          predicate-quantifier: every
          filters: .github/filters/platform-non-docs.yml

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: infra
        with:
          filters: |
            android:
              - '.github/workflows/android-publish.yml'
              - '.github/workflows/android-protocol-publish.yml'
              - '.github/workflows/android-test.yml'
              - '.github/workflows/breaking-changes.yml'
              - '.github/workflows/release.yml'
              - '.github/scripts/validate-release-version'
              - '.github/filters/**'
              - '.github/workflows/ci.yml'
            swift:
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/swift-test-package.yml'
              - '.github/workflows/swift-build-samples.yml'
              - '.github/workflows/swift-test-workflow.yml'
              - '.github/workflows/swift-lint.yml'
              - '.github/workflows/breaking-changes.yml'
              - '.github/filters/**'
              - '.github/workflows/ci.yml'
            # Common React Native infra: JS-level jobs (jest, lint, packed
            # files) and shared config that should trigger all RN jobs.
            reactNativeCommon:
              - '.github/workflows/rn-test.yml'
              - '.github/workflows/rn-check-packed-files.yml'
              - '.github/workflows/rn-lint.yml'
              - '.github/workflows/rn-publish.yml'
              - '.github/workflows/release.yml'
              - '.github/scripts/package-json-version'
              - '.github/scripts/validate-release-version'
              - '.github/actions/setup/**'
              - '.github/filters/**'
              - '.github/workflows/breaking-changes.yml'
              - '.github/workflows/ci.yml'
            # iOS-only RN infra: gates the macOS build/test jobs.
            reactNativeIos:
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/rn-test-ios.yml'
              - '.github/workflows/rn-build-ios.yml'
            # Android-only RN infra: gates the gradle build/test jobs.
            reactNativeAndroid:
              - '.github/workflows/rn-test-android.yml'
              - '.github/workflows/rn-build-android.yml'
            web:
              - '.github/workflows/web.yml'
              - '.github/actions/setup/**'
              - '.github/filters/**'
              - '.github/workflows/ci.yml'

  android-test:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android-test.yml
    with:
      ready: ${{ needs.changes.outputs.ready == 'true' }}

  swift-test-package:
    name: Swift
    needs: changes
    if: needs.changes.outputs.swift == 'true' && needs.changes.outputs.ready == 'true'
    uses: ./.github/workflows/swift-test-package.yml

  swift-build-samples:
    name: Swift
    needs: changes
    if: needs.changes.outputs.swift == 'true' && needs.changes.outputs.ready == 'true'
    uses: ./.github/workflows/swift-build-samples.yml

  swift-lint:
    name: Swift
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    uses: ./.github/workflows/swift-lint.yml
    with:
      ready: ${{ needs.changes.outputs.ready == 'true' }}

  swift-sample-package-paths:
    name: Swift Sample Package Paths
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: platforms/swift/Scripts/check_sample_package_paths

  rn-test:
    name: React Native
    needs: changes
    if: needs.changes.outputs.reactNative == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/rn-test.yml

  rn-test-android:
    name: React Native
    needs: changes
    if: needs.changes.outputs.reactNativeAndroid == 'true' && needs.changes.outputs.ready == 'true'
    uses: ./.github/workflows/rn-test-android.yml

  rn-test-ios:
    name: React Native
    needs: changes
    if: needs.changes.outputs.reactNativeIos == 'true' && needs.changes.outputs.ready == 'true'
    uses: ./.github/workflows/rn-test-ios.yml

  rn-build-android:
    name: React Native
    needs: changes
    if: needs.changes.outputs.reactNativeAndroid == 'true' && needs.changes.outputs.ready == 'true'
    uses: ./.github/workflows/rn-build-android.yml

  rn-build-ios:
    name: React Native
    needs: changes
    if: needs.changes.outputs.reactNativeIos == 'true' && needs.changes.outputs.ready == 'true'
    uses: ./.github/workflows/rn-build-ios.yml

  rn-check-packed-files:
    name: React Native
    needs: changes
    if: needs.changes.outputs.reactNative == 'true'
    uses: ./.github/workflows/rn-check-packed-files.yml

  rn-lint:
    name: React Native
    needs: changes
    if: needs.changes.outputs.reactNative == 'true'
    uses: ./.github/workflows/rn-lint.yml

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/web.yml

  breaking-changes:
    name: Breaking Changes
    needs: changes
    if: |
      needs.changes.outputs.swift == 'true' ||
      needs.changes.outputs.android == 'true' ||
      needs.changes.outputs.reactNative == 'true'
    uses: ./.github/workflows/breaking-changes.yml
    with:
      # Swift API baseline runs on macOS — defer to non-draft PRs. The Android
      # and React Native baselines are cheap ubuntu jobs and run on drafts.
      swift: ${{ needs.changes.outputs.swift == 'true' && needs.changes.outputs.ready == 'true' }}
      android: ${{ needs.changes.outputs.android }}
      react-native: ${{ needs.changes.outputs.reactNative }}

  # Single required status check for branch protection.
  # Passes when every relevant platform job either succeeded or was skipped
  # because no files in that platform's tree changed.
  ci-required:
    name: CI Required
    # Runs on drafts too, aggregating whichever jobs ran. Ready-only jobs report
    # "skipped" on drafts, which this gate treats as a pass.
    if: always()
    needs:
      - changes
      - android-test
      - swift-test-package
      - swift-build-samples
      - swift-lint
      - swift-sample-package-paths
      - rn-test
      - rn-test-android
      - rn-test-ios
      - rn-build-android
      - rn-build-ios
      - rn-check-packed-files
      - rn-lint
      - web
      - breaking-changes
    runs-on: ubuntu-latest
    steps:
      - name: Verify all upstream jobs succeeded or were skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          echo "$NEEDS_JSON" | jq '.'

          failed=$(echo "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | .[].key
          ')

          if [ -n "$failed" ]; then
            echo "::error::Required jobs failed or were cancelled:"
            echo "$failed" | sed 's/^/  - /'
            exit 1
          fi

          echo "All required jobs passed (or were skipped because no relevant files changed)."
