on:
  workflow_call:
    inputs:
      test-path:
        required: true
        type: string
      job-name:
        required: false
        type: string
        default: Run
      artifact-name:
        required: true
        type: string
      setup-storefront-env:
        required: false
        type: boolean
        default: false
      summarize-tests:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.job-name }}
    runs-on: ${{ vars.MACOS_RUNNER }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platforms/swift

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Switch to Xcode 26.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app
          echo ""

      - name: Display Current Xcode Path
        run: |
          echo "📍 Current Xcode Path:"
          xcode-select -p
          echo ""

      - name: Display Xcode Version
        run: |
          echo "🛠️ Xcode Version Information:"
          xcrun xcodebuild -version
          echo ""

      - name: List Available Simulators
        run: |
          echo "📱 Available iOS Simulator Runtimes:"
          echo "=================================="
          xcrun simctl list runtimes | grep iOS || true
          echo ""
          echo "📱 Available Device Types (iPhone only):"
          echo "========================================"
          xcrun simctl list devicetypes | grep iPhone || true
          echo ""

      - name: Clean Up Existing Simulators
        run: |
          echo "🧹 Cleaning up existing simulators..."
          xcrun simctl delete all
          echo "✅ Cleanup complete"
          echo ""

      - name: Create Test Simulator
        run: |
          echo "🔧 Creating new test simulator..."
          CURRENT_SIMULATOR_UUID=$(xcrun simctl create TestDevice "iPhone 17 Pro")
          echo "✅ Created simulator with UUID: $CURRENT_SIMULATOR_UUID"
          echo "CURRENT_SIMULATOR_UUID=$CURRENT_SIMULATOR_UUID" >> $GITHUB_ENV
          echo ""

      - name: Setup sample app storefront configuration
        if: ${{ inputs.setup-storefront-env }}
        env:
          STOREFRONT_DOMAIN: example.myshopify.com
          STOREFRONT_ACCESS_TOKEN: test-token
        run: ${{ github.workspace }}/scripts/setup_storefront_env --skip-optional-prompts

      - if: ${{ inputs.setup-storefront-env || inputs.summarize-tests }}
        uses: ./.github/actions/setup-mint

      - name: Run Tests
        run: ${{ inputs.test-path }}

      - name: Summarize test results
        if: ${{ failure() && inputs.summarize-tests }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          shopt -s nullglob
          for bundle in .xcresults/*.xcresult; do
            results=$(xcresultparser --output-format md --failed-tests-only --quiet "$bundle" | sed 's/\\"/"/g' | cat -s)
            grep -q 'Failed: [1-9]' <<< "$results" || continue
            printf '## %s\n\n%s\n' "$(basename "$bundle" .xcresult)" "$results" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload xcresult bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: .xcresults/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
