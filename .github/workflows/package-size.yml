name: Package Size

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

# `edited` matters only when the base branch changes; title and body edits
# skip every job and use their own group so they never cancel a measurement.
concurrency:
  group: package-size-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && '-edit' || '' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Packages
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.selected.outputs.android }}
      reactNative: ${{ steps.selected.outputs.reactNative }}
      web: ${{ steps.selected.outputs.web }}
      any: ${{ steps.selected.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: package
        with:
          predicate-quantifier: some-with-excludes
          filters: .ci/changed-file-filters.yml

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: infra
        with:
          filters: |
            android:
              - '.github/scripts/measure-package-size'
              - '.github/scripts/*bundle-size*'
              - '.ci/bundle-size-budgets.json'
              - '.github/workflows/bundle-size-budgets.yml'
              - '.ci/changed-file-filters.yml'
              - '.github/workflows/package-size.yml'
            reactNative:
              - '.github/actions/setup/**'
              - '.github/scripts/measure-package-size'
              - '.github/scripts/*bundle-size*'
              - '.ci/bundle-size-budgets.json'
              - '.github/workflows/bundle-size-budgets.yml'
              - '.ci/changed-file-filters.yml'
              - '.github/workflows/package-size.yml'
            web:
              - '.github/actions/setup/**'
              - '.github/scripts/measure-package-size'
              - '.github/scripts/*bundle-size*'
              - '.ci/bundle-size-budgets.json'
              - '.github/workflows/bundle-size-budgets.yml'
              - '.ci/changed-file-filters.yml'
              - '.github/workflows/package-size.yml'

      - name: Select packages to measure
        id: selected
        env:
          MEASURE_ANDROID: ${{ steps.package.outputs.android == 'true' || steps.package.outputs.protocolKotlin == 'true' || steps.package.outputs.protocolShared == 'true' || steps.infra.outputs.android == 'true' }}
          MEASURE_REACT_NATIVE: ${{ steps.package.outputs.reactNative == 'true' || steps.package.outputs.protocolTypescript == 'true' || steps.package.outputs.protocolShared == 'true' || steps.infra.outputs.reactNative == 'true' }}
          MEASURE_WEB: ${{ steps.package.outputs.web == 'true' || steps.package.outputs.protocolTypescript == 'true' || steps.package.outputs.protocolShared == 'true' || steps.infra.outputs.web == 'true' }}
        run: |
          echo "android=$MEASURE_ANDROID" >> "$GITHUB_OUTPUT"
          echo "reactNative=$MEASURE_REACT_NATIVE" >> "$GITHUB_OUTPUT"
          echo "web=$MEASURE_WEB" >> "$GITHUB_OUTPUT"
          if [[ "$MEASURE_ANDROID" == 'true' || "$MEASURE_REACT_NATIVE" == 'true' || "$MEASURE_WEB" == 'true' ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      # Keep the publisher's report contract without starting a measurement job.
      - name: Resolve current PR base for empty report
        if: steps.selected.outputs.any == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: base
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.base.sha);

      - name: Prepare empty budget report
        if: steps.selected.outputs.any == 'false'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          MEASURE_ANDROID: 'false'
          MEASURE_REACT_NATIVE: 'false'
          MEASURE_WEB: 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/bundle-size-report"
          : > "$RUNNER_TEMP/package-size-empty.tsv"
          node .github/scripts/bundle-size-budgets.cjs "$RUNNER_TEMP/package-size-empty.tsv" "$RUNNER_TEMP/package-size-empty.tsv" .ci/bundle-size-budgets.json "$RUNNER_TEMP/bundle-size-report/report.json"
          .github/scripts/measure-package-size render "$RUNNER_TEMP/package-size-empty.tsv" "$RUNNER_TEMP/package-size-empty.tsv" "$RUNNER_TEMP/bundle-size-report/comment.md"

      - name: Upload empty report
        if: steps.selected.outputs.any == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size-report
          path: ${{ runner.temp }}/bundle-size-report/
          if-no-files-found: error
          retention-days: 90

  measure:
    name: Measure Package Size
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          persist-credentials: false

      - name: Check budget policy
        run: node --test .github/scripts/*bundle-size*.test.cjs

      - name: Resolve current PR base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: base
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.base.sha);

      - name: Checkout PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: .package-size-base
          submodules: true
          persist-credentials: false

      - name: Setup base Web dependencies
        if: needs.changes.outputs.web == 'true'
        uses: ./.github/actions/setup
        with:
          node-version-file: .package-size-base/platforms/web/package.json
          cache-dependency-path: .package-size-base/platforms/web/pnpm-lock.yaml
          package-json-file: .package-size-base/platforms/web/package.json
          working-directory: .package-size-base/platforms/web

      - name: Setup head Web dependencies
        if: needs.changes.outputs.web == 'true'
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/web/package.json
          cache-dependency-path: platforms/web/pnpm-lock.yaml
          package-json-file: platforms/web/package.json
          working-directory: platforms/web

      - name: Setup base React Native dependencies
        if: needs.changes.outputs.reactNative == 'true'
        uses: ./.github/actions/setup
        with:
          node-version-file: .package-size-base/platforms/react-native/${{ hashFiles('.package-size-base/platforms/react-native/.node-version') != '' && '.node-version' || 'package.json' }}
          cache-dependency-path: .package-size-base/platforms/react-native/pnpm-lock.yaml
          package-json-file: .package-size-base/platforms/react-native/package.json
          working-directory: .package-size-base/platforms/react-native

      - name: Setup head React Native dependencies
        if: needs.changes.outputs.reactNative == 'true'
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/.node-version
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Install JDK
        if: needs.changes.outputs.android == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Measure base package sizes
        continue-on-error: true
        env:
          MEASURE_ANDROID: ${{ needs.changes.outputs.android }}
          MEASURE_REACT_NATIVE: ${{ needs.changes.outputs.reactNative }}
          MEASURE_WEB: ${{ needs.changes.outputs.web }}
          PACKAGE_SIZE_REPO_ROOT: ${{ github.workspace }}/.package-size-base
        run: .github/scripts/measure-package-size collect /tmp/package-size-base.tsv

      - name: Measure head package sizes
        env:
          MEASURE_ANDROID: ${{ needs.changes.outputs.android }}
          MEASURE_REACT_NATIVE: ${{ needs.changes.outputs.reactNative }}
          MEASURE_WEB: ${{ needs.changes.outputs.web }}
        run: .github/scripts/measure-package-size collect /tmp/package-size-head.tsv

      - name: Render package size comment
        run: |
          touch /tmp/package-size-base.tsv
          .github/scripts/measure-package-size render /tmp/package-size-base.tsv /tmp/package-size-head.tsv /tmp/package-size-comment.md

      - name: Prepare budget report
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          MEASURE_ANDROID: ${{ needs.changes.outputs.android }}
          MEASURE_REACT_NATIVE: ${{ needs.changes.outputs.reactNative }}
          MEASURE_WEB: ${{ needs.changes.outputs.web }}
        run: |
          mkdir -p /tmp/bundle-size-report
          node .github/scripts/bundle-size-budgets.cjs /tmp/package-size-base.tsv /tmp/package-size-head.tsv .ci/bundle-size-budgets.json /tmp/bundle-size-report/report.json
          cp /tmp/package-size-comment.md /tmp/bundle-size-report/comment.md

      - name: Upload measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size-report
          path: /tmp/bundle-size-report/
          if-no-files-found: error
          retention-days: 90
