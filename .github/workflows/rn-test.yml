name: React Native — Run Jest Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Run jest tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: platforms/react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/package.json
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Run tests with coverage
        run: pnpm test --coverage --testPathPatterns="modules/@shopify/checkout-kit-react-native/tests" --coverageReporters=json-summary

      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@642ef024cc554a34b7082cea12c7bf63575ae151 # main
        with:
          coverage-summary-path: platforms/react-native/coverage/coverage-summary.json
          title: 'React Native — Coverage Report'
          create-new-comment: false

      # Runs without --coverage so the coverage report above stays scoped to the
      # published module.
      - name: Run sample tests
        run: pnpm test --testPathPatterns="sample/src"
