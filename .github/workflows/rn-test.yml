name: React Native — Run Jest Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Run jest tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: read
    defaults:
      run:
        working-directory: platforms/react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/package.json
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Run tests with coverage
        id: coverage_tests
        run: pnpm test --coverage --testPathPatterns="modules/@shopify/checkout-kit-react-native/tests" --coverageReporters=json-summary

      - name: Record coverage
        if: ${{ !cancelled() }}
        uses: ./.github/actions/report-coverage
        with:
          platform: react-native
          report-path: platforms/react-native/coverage/coverage-summary.json
          report-directory: platforms/react-native/coverage
          outcome: ${{ steps.coverage_tests.outcome }}

      # Runs without --coverage so the coverage report above stays scoped to the
      # published module.
      - name: Run sample tests
        run: pnpm test --testPathPatterns="sample/src"
