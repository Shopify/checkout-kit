name: Swift — Documentation

on:
  pull_request:
    paths:
      - '.github/workflows/swift-docs.yml'
      - '.github/workflows/release.yml'
      - 'Package.swift'
      - 'Package.resolved'
      - 'platforms/swift/Sources/**'
      - 'platforms/swift/Scripts/build_docs'
      - 'protocol/languages/swift/Sources/**'
      - 'telemetry/languages/swift/Sources/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Swift release tag (including prereleases)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swift-docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'release' && !contains(github.event.release.tag_name, '/')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ${{ vars.MACOS_RUNNER }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Keep the publishing tools on main so older release tags can be rebuilt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require a published Swift release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a Swift release tag, got: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != 'false' ]]; then
            echo "::error::Documentation can only be deployed for a published release."
            exit 1
          fi

      - name: Checkout released sources
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: .build/swift-docs-source
          persist-credentials: false

      - name: Switch to Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build Swift API reference
        env:
          HOSTING_BASE_PATH: ${{ github.event_name == 'pull_request' && '/checkout-kit' || steps.pages.outputs.base_path }}
          SOURCE_ROOT: ${{ github.event_name == 'pull_request' && github.workspace || format('{0}/.build/swift-docs-source', github.workspace) }}
        run: platforms/swift/Scripts/build_docs "$HOSTING_BASE_PATH" "$SOURCE_ROOT"

      - name: Upload documentation site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .build/swift-docs/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Swift API reference
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
