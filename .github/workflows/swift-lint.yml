name: Swift — Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # SwiftLint and SwiftFormat run on macOS in the Bitrise ci-ios swift-lint job. This
  # Linux copy stays for its inline pull request annotations.
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: norio-nomura/action-swiftlint@9f4dcd7fd46b4e75d7935cf2f4df406d5cae3684 # 3.2.1
        with:
          args: --strict

