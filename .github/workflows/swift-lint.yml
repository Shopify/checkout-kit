name: Swift — Lint

on:
  workflow_call:
    inputs:
      ready:
        description: When false, skip the macOS-only jobs (SwiftFormat, CocoaPods).
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ready:
        description: When false, skip the macOS-only jobs (SwiftFormat, CocoaPods).
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # swiftlint is a separate/duplicate effort here, as it will also report to Annotations
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: norio-nomura/action-swiftlint@9f4dcd7fd46b4e75d7935cf2f4df406d5cae3684 # 3.2.1
        with:
          args: --strict

  swiftformat:
    name: SwiftFormat & SwiftLint
    # macOS runner — deferred to non-draft PRs.
    if: ${{ inputs.ready }}
    runs-on: ${{ vars.MACOS_RUNNER }}
    env:
      MINT_PATH: ${{ github.workspace }}/.mint/lib
      MINT_LINK_PATH: ${{ github.workspace }}/.mint/bin
    defaults:
      run:
        working-directory: platforms/swift
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Cache Mint packages
        id: mint-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .mint
          key: ${{ runner.os }}-mint-${{ hashFiles('platforms/swift/Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-mint-

      - name: Install Mint
        run: brew install mint

      - name: Bootstrap Mint packages
        if: steps.mint-cache.outputs.cache-hit != 'true'
        run: mint bootstrap --link

      - name: Add Mint to PATH
        run: echo "${{ github.workspace }}/.mint/bin" >> "$GITHUB_PATH"

      - run: ./Scripts/lint check --verbose --skip-pod

  lint-podspec:
    name: CocoaPods
    # macOS runner — deferred to non-draft PRs.
    if: ${{ inputs.ready }}
    runs-on: ${{ vars.MACOS_RUNNER }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/platforms/swift/Gemfile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          bundler-cache: true
          working-directory: platforms/swift
      # The podspec lives at the repo root so it can glob source files in
      # both platforms/swift/ and protocol/languages/swift/. Lint runs from
      # the repo root; the Gemfile under platforms/swift/ is still used via
      # BUNDLE_GEMFILE above.
      - run: bundle exec pod lib lint ShopifyCheckoutKit.podspec --allow-warnings
