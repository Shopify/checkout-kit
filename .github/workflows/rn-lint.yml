name: React Native — Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# TODO: remove once ShopifyCheckoutKit is published to CocoaPods trunk and
# Maven Central. Tracks the new pod/AAR name introduced by the
# ShopifyCheckoutSheetKit → ShopifyCheckoutKit rename.
env:
  USE_LOCAL_SDK: "1"

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: norio-nomura/action-swiftlint@9f4dcd7fd46b4e75d7935cf2f4df406d5cae3684 # 3.2.1
        with:
          args: --strict

  lint:
    name: Lint module + sample
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platforms/react-native
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/package.json
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Build module
        run: pnpm module build

      - name: Lint module
        run: pnpm module lint

      - name: Lint sample
        run: pnpm sample lint
