name: React Native — Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: norio-nomura/action-swiftlint@9f4dcd7fd46b4e75d7935cf2f4df406d5cae3684 # 3.2.1
        env:
          WORKING_DIRECTORY: platforms/react-native
        with:
          args: --strict modules/@shopify/checkout-kit-react-native --config .swiftlint.yml

  swiftformat:
    name: SwiftFormat & SwiftLint
    runs-on: ${{ vars.MACOS_RUNNER }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mint

      - name: Check Swift bridge lint and formatting
        working-directory: platforms/react-native
        run: ./scripts/lint_swift check

  lint:
    name: Lint module + sample
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platforms/react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/package.json
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Build module
        run: pnpm module build

      - name: Lint module
        run: pnpm module lint

      - name: Lint sample
        run: pnpm sample lint
