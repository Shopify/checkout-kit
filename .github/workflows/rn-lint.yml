name: React Native — Lint

on:
  workflow_call:
    inputs:
      swift:
        description: Run SwiftLint and SwiftFormat on the Swift bridge.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      swift:
        description: Run SwiftLint and SwiftFormat on the Swift bridge.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  swiftformat:
    name: SwiftFormat & SwiftLint
    if: inputs.swift
    runs-on: ${{ vars.MACOS_RUNNER }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mint

      - name: Check Swift bridge lint and formatting
        working-directory: platforms/react-native
        run: ./scripts/lint_swift check

  lint:
    name: Lint module + sample
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platforms/react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The guard scans workflows and scripts outside the Swift lint inputs, so
      # it runs here even when the caller skips the Swift jobs.
      - name: Check Xcode package resolution
        run: ../../scripts/check_xcodebuild_package_resolution

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/.node-version
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Lint module
        run: pnpm module lint

      - name: Lint sample
        run: pnpm sample lint
