name: Protocol

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: protocol/package.json
          cache-dependency-path: protocol/pnpm-lock.yaml
          package-json-file: protocol/package.json
          working-directory: protocol

      - name: Test with coverage
        run: pnpm test --coverage

      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@58072a21b8b7f84d36a6e21b5d9a0cad08bc9d75 # main
        with:
          coverage-summary-path: protocol/coverage/coverage-summary.json
          title: 'Protocol — Coverage Report'
          create-new-comment: false
