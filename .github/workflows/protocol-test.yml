name: Protocol

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: protocol/package.json
          cache-dependency-path: protocol/pnpm-lock.yaml
          package-json-file: protocol/package.json
          working-directory: protocol

      - name: Test with coverage
        run: pnpm test --coverage

      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@642ef024cc554a34b7082cea12c7bf63575ae151 # main
        with:
          coverage-summary-path: protocol/coverage/coverage-summary.json
          title: 'Protocol — Coverage Report'
          create-new-comment: false
