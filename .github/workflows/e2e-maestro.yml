name: E2E Maestro

on:
  workflow_dispatch:
    inputs:
      target:
        description: E2E target to run
        required: true
        default: all
        type: choice
        options:
          - all
          - rn-ios
          - rn-android
          - swift-ios
          - android

permissions:
  contents: read

env:
  E2E_API_VERSION: ${{ vars.E2E_API_VERSION || '2026-04' }}
  E2E_STOREFRONT_DOMAIN: ${{ vars.E2E_STOREFRONT_DOMAIN || secrets.E2E_STOREFRONT_DOMAIN }}
  E2E_STOREFRONT_ACCESS_TOKEN: ${{ secrets.E2E_STOREFRONT_ACCESS_TOKEN }}
  E2E_STOREFRONT_MERCHANT_IDENTIFIER: ${{ vars.E2E_STOREFRONT_MERCHANT_IDENTIFIER || secrets.E2E_STOREFRONT_MERCHANT_IDENTIFIER }}
  E2E_EMAIL: maestro.e2e@shopify.com
  E2E_FIRST_NAME: Maestro
  E2E_LAST_NAME: Shopify
  E2E_COMPANY: Shopify
  E2E_ADDRESS_1: 700 S Flower St
  E2E_ADDRESS_2: ""
  E2E_CITY: Los Angeles
  E2E_COUNTRY: US
  E2E_PROVINCE: CA
  E2E_ZIP: "90017"
  E2E_PHONE: "+16135550123"
  E2E_MAESTRO_ATTEMPTS: "3"
  USE_LOCAL_SDK: "1"

concurrency:
  group: e2e-maestro-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  rn-ios:
    name: React Native iOS
    if: ${{ inputs.target == 'all' || inputs.target == 'rn-ios' }}
    runs-on: ${{ vars.MACOS_RUNNER }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: platforms/react-native
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Switch to Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Setup iOS Simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep iPhone
          xcrun simctl delete all
          CURRENT_SIMULATOR_UUID="$(xcrun simctl create TestDevice "iPhone 16 Pro")"
          xcrun simctl boot "$CURRENT_SIMULATOR_UUID"
          xcrun simctl bootstatus "$CURRENT_SIMULATOR_UUID" -b
          echo "CURRENT_SIMULATOR_UUID=$CURRENT_SIMULATOR_UUID" >> "$GITHUB_ENV"

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/package.json
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Setup Ruby
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: platforms/react-native/sample

      - name: Cache cocoapods
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: platforms/react-native/sample/ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('platforms/react-native/sample/ios/Podfile.lock', 'platforms/react-native/sample/Gemfile.lock', 'platforms/react-native/sample/Gemfile', 'platforms/react-native/package.json', 'platforms/react-native/sample/package.json', 'platforms/react-native/modules/@shopify/checkout-kit-react-native/package.json', 'platforms/react-native/pnpm-lock.yaml') }}

      - name: Install cocoapods
        working-directory: platforms/react-native/sample
        run: |
          set -euo pipefail
          bundle install
          cd ios
          bundle exec pod install --deployment --repo-update

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Materialize sample environment
        run: |
          set -euo pipefail
          if [[ -z "${E2E_STOREFRONT_DOMAIN}" || -z "${E2E_STOREFRONT_ACCESS_TOKEN}" ]]; then
            echo "::error::Set E2E_STOREFRONT_DOMAIN and E2E_STOREFRONT_ACCESS_TOKEN before running this workflow."
            exit 1
          fi
          echo "::add-mask::${E2E_STOREFRONT_ACCESS_TOKEN}"
          cat > sample/.env <<EOF
          STOREFRONT_DOMAIN="${E2E_STOREFRONT_DOMAIN}"
          STOREFRONT_ACCESS_TOKEN="${E2E_STOREFRONT_ACCESS_TOKEN}"
          STOREFRONT_MERCHANT_IDENTIFIER="${E2E_STOREFRONT_MERCHANT_IDENTIFIER}"
          STOREFRONT_VERSION="${E2E_API_VERSION}"

          EMAIL="${E2E_EMAIL}"
          ADDRESS_1="${E2E_ADDRESS_1}"
          ADDRESS_2="${E2E_ADDRESS_2}"
          CITY="${E2E_CITY}"
          COMPANY="${E2E_COMPANY}"
          COUNTRY="${E2E_COUNTRY}"
          FIRST_NAME="${E2E_FIRST_NAME}"
          LAST_NAME="${E2E_LAST_NAME}"
          PROVINCE="${E2E_PROVINCE}"
          ZIP="${E2E_ZIP}"
          PHONE="${E2E_PHONE}"

          # Customer Account API is intentionally disabled for this checkout smoke test.
          CUSTOMER_ACCOUNT_API_CLIENT_ID=""
          CUSTOMER_ACCOUNT_API_SHOP_ID=""
          EOF

      - name: Build module
        run: pnpm module build

      - name: Start Metro
        run: |
          set -euo pipefail
          pnpm sample start > "$RUNNER_TEMP/rn-ios-metro.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/rn-ios-metro.pid"
          for _ in {1..60}; do
            if curl -fsS "http://localhost:8081/status" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/rn-ios-metro.log"
          exit 1

      - name: Build and launch sample
        run: pnpm sample ios -- --udid "$CURRENT_SIMULATOR_UUID"

      - name: Run Maestro flow
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "${E2E_MAESTRO_ATTEMPTS}"); do
            echo "Maestro attempt ${attempt}/${E2E_MAESTRO_ATTEMPTS}"
            if pnpm e2e:ios; then
              exit 0
            fi
            if [[ "${attempt}" == "${E2E_MAESTRO_ATTEMPTS}" ]]; then
              exit 1
            fi
            sleep 10
          done

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-rn-ios-${{ github.run_attempt }}
          path: |
            ~/.maestro/tests/**
            ${{ runner.temp }}/rn-ios-metro.log
          if-no-files-found: ignore

  rn-android:
    name: React Native Android
    if: ${{ inputs.target == 'all' || inputs.target == 'rn-android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAVA_VERSION: '22'
    defaults:
      run:
        shell: bash
        working-directory: platforms/react-native
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/package.json
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Install JDK
        id: setup-java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            platforms/android/**/*.gradle*
            platforms/android/**/gradle-wrapper.properties
            platforms/android/gradle.properties
            platforms/react-native/package.json
            platforms/react-native/pnpm-lock.yaml
            platforms/react-native/sample/package.json
            platforms/react-native/sample/android/**/*.gradle*
            platforms/react-native/sample/android/**/gradle-wrapper.properties
            platforms/react-native/sample/android/gradle.properties
            platforms/react-native/modules/@shopify/checkout-kit-react-native/android/**/*.gradle*
            platforms/react-native/modules/@shopify/checkout-kit-react-native/android/gradle.properties

      - name: Start Android emulator
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo "no" | avdmanager create avd --force --name maestro --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          nohup emulator -avd maestro -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/rn-android-emulator.log" 2>&1 &
          adb wait-for-device
          until [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; do
            sleep 5
          done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          MAESTRO_ANDROID_UDID="$(adb devices | awk '$2 == "device" { print $1; exit }')"
          if [[ -z "${MAESTRO_ANDROID_UDID}" ]]; then
            echo "::error::Could not resolve booted Android emulator UDID."
            adb devices
            exit 1
          fi
          echo "MAESTRO_ANDROID_UDID=${MAESTRO_ANDROID_UDID}" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Materialize sample environment
        run: |
          set -euo pipefail
          if [[ -z "${E2E_STOREFRONT_DOMAIN}" || -z "${E2E_STOREFRONT_ACCESS_TOKEN}" ]]; then
            echo "::error::Set E2E_STOREFRONT_DOMAIN and E2E_STOREFRONT_ACCESS_TOKEN before running this workflow."
            exit 1
          fi
          echo "::add-mask::${E2E_STOREFRONT_ACCESS_TOKEN}"
          cat > sample/.env <<EOF
          STOREFRONT_DOMAIN="${E2E_STOREFRONT_DOMAIN}"
          STOREFRONT_ACCESS_TOKEN="${E2E_STOREFRONT_ACCESS_TOKEN}"
          STOREFRONT_MERCHANT_IDENTIFIER="${E2E_STOREFRONT_MERCHANT_IDENTIFIER}"
          STOREFRONT_VERSION="${E2E_API_VERSION}"

          EMAIL="${E2E_EMAIL}"
          ADDRESS_1="${E2E_ADDRESS_1}"
          ADDRESS_2="${E2E_ADDRESS_2}"
          CITY="${E2E_CITY}"
          COMPANY="${E2E_COMPANY}"
          COUNTRY="${E2E_COUNTRY}"
          FIRST_NAME="${E2E_FIRST_NAME}"
          LAST_NAME="${E2E_LAST_NAME}"
          PROVINCE="${E2E_PROVINCE}"
          ZIP="${E2E_ZIP}"
          PHONE="${E2E_PHONE}"

          # Customer Account API is intentionally disabled for this checkout smoke test.
          CUSTOMER_ACCOUNT_API_CLIENT_ID=""
          CUSTOMER_ACCOUNT_API_SHOP_ID=""
          EOF

      - name: Build module
        run: pnpm module build

      - name: Start Metro
        run: |
          set -euo pipefail
          pnpm sample start > "$RUNNER_TEMP/rn-android-metro.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/rn-android-metro.pid"
          for _ in {1..60}; do
            if curl -fsS "http://localhost:8081/status" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/rn-android-metro.log"
          exit 1

      - name: Build and launch sample
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=768m
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: pnpm sample android -- --no-packager

      - name: Run Maestro flow
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "${E2E_MAESTRO_ATTEMPTS}"); do
            echo "Maestro attempt ${attempt}/${E2E_MAESTRO_ATTEMPTS}"
            if pnpm e2e:android; then
              exit 0
            fi
            if [[ "${attempt}" == "${E2E_MAESTRO_ATTEMPTS}" ]]; then
              exit 1
            fi
            sleep 10
          done

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-rn-android-${{ github.run_attempt }}
          path: |
            ~/.maestro/tests/**
            ${{ runner.temp }}/rn-android-metro.log
            ${{ runner.temp }}/rn-android-emulator.log
          if-no-files-found: ignore

  swift-ios:
    name: Swift iOS
    if: ${{ inputs.target == 'all' || inputs.target == 'swift-ios' }}
    runs-on: ${{ vars.MACOS_RUNNER }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: platforms/swift
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Switch to Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Setup iOS Simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep iPhone
          xcrun simctl delete all
          CURRENT_SIMULATOR_UUID="$(xcrun simctl create TestDevice "iPhone 16 Pro")"
          xcrun simctl boot "$CURRENT_SIMULATOR_UUID"
          xcrun simctl bootstatus "$CURRENT_SIMULATOR_UUID" -b
          echo "CURRENT_SIMULATOR_UUID=$CURRENT_SIMULATOR_UUID" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Materialize sample environment
        run: |
          set -euo pipefail
          if [[ -z "${E2E_STOREFRONT_DOMAIN}" || -z "${E2E_STOREFRONT_ACCESS_TOKEN}" ]]; then
            echo "::error::Set E2E_STOREFRONT_DOMAIN and E2E_STOREFRONT_ACCESS_TOKEN before running this workflow."
            exit 1
          fi
          echo "::add-mask::${E2E_STOREFRONT_ACCESS_TOKEN}"
          cat > Samples/MobileBuyIntegration/Storefront.xcconfig <<EOF
          STOREFRONT_DOMAIN = ${E2E_STOREFRONT_DOMAIN}
          STOREFRONT_ACCESS_TOKEN = ${E2E_STOREFRONT_ACCESS_TOKEN}
          STOREFRONT_MERCHANT_IDENTIFIER = ${E2E_STOREFRONT_MERCHANT_IDENTIFIER}

          // Customer Account API is intentionally disabled for this checkout smoke test.
          CUSTOMER_ACCOUNT_API_CLIENT_ID =
          CUSTOMER_ACCOUNT_API_SHOP_ID =

          EMAIL = ${E2E_EMAIL}
          FIRST_NAME = ${E2E_FIRST_NAME}
          LAST_NAME = ${E2E_LAST_NAME}
          ADDRESS_1 = ${E2E_ADDRESS_1}
          ADDRESS_2 = ${E2E_ADDRESS_2}
          CITY = ${E2E_CITY}
          COUNTRY = ${E2E_COUNTRY}
          PROVINCE = ${E2E_PROVINCE}
          ZIP = ${E2E_ZIP}
          PHONE = ${E2E_PHONE}

          API_VERSION = ${E2E_API_VERSION}
          EOF

      - name: Build sample
        working-directory: platforms/swift/Samples
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -workspace Samples.xcworkspace \
            -scheme MobileBuyIntegration \
            -sdk iphonesimulator \
            -destination "id=${CURRENT_SIMULATOR_UUID}" \
            -derivedDataPath "${RUNNER_TEMP}/swift-mobile-buy-derived-data" \
            -skipPackagePluginValidation

      - name: Install and launch sample
        run: |
          set -euo pipefail
          APP_PATH="${RUNNER_TEMP}/swift-mobile-buy-derived-data/Build/Products/Debug-iphonesimulator/MobileBuyIntegration.app"
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::Could not find built MobileBuyIntegration.app."
            exit 1
          fi
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Could not find built MobileBuyIntegration.app at $APP_PATH."
            exit 1
          fi
          xcrun simctl install "$CURRENT_SIMULATOR_UUID" "$APP_PATH"
          xcrun simctl launch "$CURRENT_SIMULATOR_UUID" com.shopify.example.MobileBuyIntegration

      - name: Run Maestro flow
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "${E2E_MAESTRO_ATTEMPTS}"); do
            echo "Maestro attempt ${attempt}/${E2E_MAESTRO_ATTEMPTS}"
            if ./Scripts/e2e_maestro_ios; then
              exit 0
            fi
            if [[ "${attempt}" == "${E2E_MAESTRO_ATTEMPTS}" ]]; then
              exit 1
            fi
            sleep 10
          done

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-swift-ios-${{ github.run_attempt }}
          path: ~/.maestro/tests/**
          if-no-files-found: ignore

  android:
    name: Native Android
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Install JDK 1.17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Start Android emulator
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo "no" | avdmanager create avd --force --name maestro --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          nohup emulator -avd maestro -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/android-emulator.log" 2>&1 &
          adb wait-for-device
          until [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; do
            sleep 5
          done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          MAESTRO_ANDROID_UDID="$(adb devices | awk '$2 == "device" { print $1; exit }')"
          if [[ -z "${MAESTRO_ANDROID_UDID}" ]]; then
            echo "::error::Could not resolve booted Android emulator UDID."
            adb devices
            exit 1
          fi
          echo "MAESTRO_ANDROID_UDID=${MAESTRO_ANDROID_UDID}" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Materialize sample environment
        working-directory: platforms/android/samples/MobileBuyIntegration
        run: |
          set -euo pipefail
          if [[ -z "${E2E_STOREFRONT_DOMAIN}" || -z "${E2E_STOREFRONT_ACCESS_TOKEN}" ]]; then
            echo "::error::Set E2E_STOREFRONT_DOMAIN and E2E_STOREFRONT_ACCESS_TOKEN before running this workflow."
            exit 1
          fi
          echo "::add-mask::${E2E_STOREFRONT_ACCESS_TOKEN}"
          cat > .env <<EOF
          STOREFRONT_DOMAIN=${E2E_STOREFRONT_DOMAIN}
          STOREFRONT_ACCESS_TOKEN=${E2E_STOREFRONT_ACCESS_TOKEN}
          API_VERSION=${E2E_API_VERSION}

          # Customer Account API is intentionally disabled for this checkout smoke test.
          CUSTOMER_ACCOUNT_API_CLIENT_ID=
          CUSTOMER_ACCOUNT_API_REDIRECT_URI=
          CUSTOMER_ACCOUNT_API_GRAPHQL_BASE_URL=
          CUSTOMER_ACCOUNT_API_AUTH_BASE_URL=

          PREFILL_EMAIL=${E2E_EMAIL}
          PREFILL_PHONE=${E2E_PHONE}
          EOF

      - name: Build sample
        working-directory: platforms/android/samples/MobileBuyIntegration
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Install and launch sample
        working-directory: platforms/android/samples/MobileBuyIntegration
        run: |
          set -euo pipefail
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -n com.shopify.checkout_kit_mobile_buy_integration_sample/.MainActivity

      - name: Run Maestro flow
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "${E2E_MAESTRO_ATTEMPTS}"); do
            echo "Maestro attempt ${attempt}/${E2E_MAESTRO_ATTEMPTS}"
            if ./scripts/e2e_maestro_android; then
              exit 0
            fi
            if [[ "${attempt}" == "${E2E_MAESTRO_ATTEMPTS}" ]]; then
              exit 1
            fi
            sleep 10
          done

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-android-${{ github.run_attempt }}
          path: |
            ~/.maestro/tests/**
            ${{ runner.temp }}/android-emulator.log
          if-no-files-found: ignore
