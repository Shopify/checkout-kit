name: React Native — Run iOS Tests

on:
  workflow_call:
    inputs:
      sdk-source:
        description: ShopifyCheckoutKit to test against — "published" (committed lockfile) or "local" (in-repo platforms/swift).
        type: string
        default: published
  workflow_dispatch:
    inputs:
      sdk-source:
        description: ShopifyCheckoutKit to test against.
        type: choice
        default: published
        options:
          - published
          - local

permissions:
  contents: read

jobs:
  test-ios:
    name: Run iOS Tests (${{ inputs.sdk-source }})
    runs-on: ${{ vars.MACOS_RUNNER }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platforms/react-native
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Switch to Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Display Xcode info
        run: |
          echo "Xcode Path: $(xcode-select -p)"
          echo "Xcode Version: $(xcrun xcodebuild -version)"

      - name: Setup iOS Simulator
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep iPhone
          xcrun simctl delete all
          CURRENT_SIMULATOR_UUID=$(xcrun simctl create TestDevice "iPhone 16 Pro")
          echo "CURRENT_SIMULATOR_UUID=$CURRENT_SIMULATOR_UUID" >> "$GITHUB_ENV"

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/package.json
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Setup Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: platforms/react-native/sample

      - name: Verify iOS lockfile uses published native SDK
        if: inputs.sdk-source == 'published'
        run: scripts/check_published_podfile_lock sample/ios/Podfile.lock

      - name: Cache cocoapods
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: platforms/react-native/sample/ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ inputs.sdk-source }}-${{ hashFiles('platforms/react-native/sample/ios/Podfile.lock', 'platforms/react-native/sample/Gemfile.lock', 'platforms/react-native/sample/Gemfile', 'platforms/react-native/package.json', 'platforms/react-native/sample/package.json', 'platforms/react-native/modules/@shopify/checkout-kit-react-native/package.json', 'platforms/react-native/pnpm-lock.yaml') }}

      - name: Install cocoapods (published SDK)
        if: inputs.sdk-source == 'published'
        working-directory: platforms/react-native/sample
        run: |
          set -euo pipefail
          bundle install
          cd ios
          bundle exec pod install --deployment --repo-update

      # Test the RN sample against the in-repo platforms/swift SDK (USE_LOCAL_SDK)
      # so bridge/SDK incompatibilities are caught before the SDK ships a versioned
      # pod. `pod update` (not install) repoints the pinned pod at the local :path
      # dev pod and rewrites Podfile.lock on the runner only; the committed lockfile
      # stays on the published pod.
      - name: Install cocoapods (local SDK)
        if: inputs.sdk-source == 'local'
        working-directory: platforms/react-native/sample
        env:
          USE_LOCAL_SDK: "1"
        run: |
          set -euo pipefail
          bundle install
          cd ios
          bundle exec pod update ShopifyCheckoutKit --repo-update

      - name: Build module
        run: pnpm module build

      - name: Run iOS tests
        run: pnpm sample test:ios
