name: Breaking Changes

on:
  workflow_call:
    inputs:
      swift:
        type: string
        required: true
      android:
        type: string
        required: true
      react-native:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      swift:
        type: string
        required: false
        default: 'true'
      android:
        type: string
        required: false
        default: 'true'
      react-native:
        type: string
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  swift:
    name: Swift
    if: inputs.swift == 'true'
    runs-on: ${{ vars.MACOS_RUNNER }}
    defaults:
      run:
        working-directory: platforms/swift
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Switch to Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Check public Swift API baseline
        run: ./Scripts/api check

  android:
    name: Android
    if: inputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install JDK 1.17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: zulu
          java-version: 17
          cache: 'gradle'

      - name: Check public Android API baseline
        run: ./gradlew :lib:apiCheck --console=plain

      - name: Check public Kotlin protocol API baseline
        run: ../../protocol/languages/kotlin/gradlew -p ../../protocol/languages/kotlin :embedded-checkout-protocol:apiCheck --console=plain

  react-native:
    name: React Native
    if: inputs.react-native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platforms/react-native
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/package.json
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Check public React Native API baseline
        run: pnpm module api:check
