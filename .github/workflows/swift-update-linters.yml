name: Swift — Update Linter Versions

on:
  schedule:
    - cron: '0 10 * * 1' # Monday 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ${{ vars.MACOS_RUNNER }}
    env:
      MINT_PATH: ${{ github.workspace }}/.mint/lib
      MINT_LINK_PATH: ${{ github.workspace }}/.mint/bin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read current versions from Mintfile
        id: current
        run: |
          SWIFTLINT=$(grep 'realm/SwiftLint@' platforms/swift/Mintfile | sed 's/.*@//')
          SWIFTFORMAT=$(grep 'nicklockwood/SwiftFormat@' platforms/swift/Mintfile | sed 's/.*@//')
          echo "swiftlint=$SWIFTLINT" >> "$GITHUB_OUTPUT"
          echo "swiftformat=$SWIFTFORMAT" >> "$GITHUB_OUTPUT"

      - name: Check latest versions
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SWIFTLINT=$(gh api repos/realm/SwiftLint/releases/latest --jq '.tag_name')
          SWIFTFORMAT=$(gh api repos/nicklockwood/SwiftFormat/releases/latest --jq '.tag_name')
          echo "swiftlint=$SWIFTLINT" >> "$GITHUB_OUTPUT"
          echo "swiftformat=$SWIFTFORMAT" >> "$GITHUB_OUTPUT"

      - name: Determine updates needed
        id: check
        env:
          SWIFTLINT_CURRENT: ${{ steps.current.outputs.swiftlint }}
          SWIFTLINT_LATEST: ${{ steps.latest.outputs.swiftlint }}
          SWIFTFORMAT_CURRENT: ${{ steps.current.outputs.swiftformat }}
          SWIFTFORMAT_LATEST: ${{ steps.latest.outputs.swiftformat }}
        run: |
          HAS_UPDATES=false
          if [ "$SWIFTLINT_CURRENT" != "$SWIFTLINT_LATEST" ]; then
            echo "swiftlint_updated=true" >> "$GITHUB_OUTPUT"
            HAS_UPDATES=true
          fi
          if [ "$SWIFTFORMAT_CURRENT" != "$SWIFTFORMAT_LATEST" ]; then
            echo "swiftformat_updated=true" >> "$GITHUB_OUTPUT"
            HAS_UPDATES=true
          fi
          echo "has_updates=$HAS_UPDATES" >> "$GITHUB_OUTPUT"

      - name: Check for existing PR
        if: steps.check.outputs.has_updates == 'true'
        id: existing_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh pr list --head "auto/update-linters" --state open --json number --jq '.[0].number // empty')
          echo "exists=$( [ -n "$EXISTING" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Create branch and update Mintfile
        if: steps.check.outputs.has_updates == 'true' && steps.existing_pr.outputs.exists != 'true'
        env:
          SWIFTLINT_LATEST: ${{ steps.latest.outputs.swiftlint }}
          SWIFTFORMAT_LATEST: ${{ steps.latest.outputs.swiftformat }}
        run: |
          git checkout -b auto/update-linters
          printf '%s\n' \
            "realm/SwiftLint@$SWIFTLINT_LATEST" \
            "nicklockwood/SwiftFormat@$SWIFTFORMAT_LATEST" \
            > platforms/swift/Mintfile

      - name: Install Mint and bootstrap new versions
        if: steps.check.outputs.has_updates == 'true' && steps.existing_pr.outputs.exists != 'true'
        working-directory: platforms/swift
        run: |
          brew install mint
          echo "${{ github.workspace }}/.mint/bin" >> "$GITHUB_PATH"
          mint bootstrap --link

      - name: Run lint fix
        if: steps.check.outputs.has_updates == 'true' && steps.existing_pr.outputs.exists != 'true'
        working-directory: platforms/swift
        run: ./Scripts/lint fix --verbose

      - name: Commit and push
        if: steps.check.outputs.has_updates == 'true' && steps.existing_pr.outputs.exists != 'true'
        env:
          SWIFTLINT_CURRENT: ${{ steps.current.outputs.swiftlint }}
          SWIFTLINT_LATEST: ${{ steps.latest.outputs.swiftlint }}
          SWIFTFORMAT_CURRENT: ${{ steps.current.outputs.swiftformat }}
          SWIFTFORMAT_LATEST: ${{ steps.latest.outputs.swiftformat }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update Swift linter versions" \
            -m "SwiftLint: $SWIFTLINT_CURRENT -> $SWIFTLINT_LATEST" \
            -m "SwiftFormat: $SWIFTFORMAT_CURRENT -> $SWIFTFORMAT_LATEST"
          git push origin auto/update-linters

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true' && steps.existing_pr.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SWIFTLINT_UPDATED: ${{ steps.check.outputs.swiftlint_updated }}
          SWIFTFORMAT_UPDATED: ${{ steps.check.outputs.swiftformat_updated }}
          SWIFTLINT_CURRENT: ${{ steps.current.outputs.swiftlint }}
          SWIFTLINT_LATEST: ${{ steps.latest.outputs.swiftlint }}
          SWIFTFORMAT_CURRENT: ${{ steps.current.outputs.swiftformat }}
          SWIFTFORMAT_LATEST: ${{ steps.latest.outputs.swiftformat }}
        run: |
          BODY="## Linter Version Updates\n\n"
          if [ "$SWIFTLINT_UPDATED" == "true" ]; then
            BODY+="- **SwiftLint**: \`$SWIFTLINT_CURRENT\` → \`$SWIFTLINT_LATEST\`\n"
            BODY+="  [Release notes](https://github.com/realm/SwiftLint/releases/tag/$SWIFTLINT_LATEST)\n"
          fi
          if [ "$SWIFTFORMAT_UPDATED" == "true" ]; then
            BODY+="- **SwiftFormat**: \`$SWIFTFORMAT_CURRENT\` → \`$SWIFTFORMAT_LATEST\`\n"
            BODY+="  [Release notes](https://github.com/nicklockwood/SwiftFormat/releases/tag/$SWIFTFORMAT_LATEST)\n"
          fi
          BODY+="\n---\n\n"
          BODY+="\`./Scripts/lint fix\` has been run to apply formatting changes.\n\n"
          BODY+="### ⚠️ CI checks need to be triggered manually\n\n"
          BODY+="This PR was created by GitHub Actions using \`GITHUB_TOKEN\`, which "
          BODY+="[does not trigger other workflows](https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow). "
          BODY+="To run CI checks, either:\n\n"
          BODY+="1. **Close and reopen this PR** — this fires a new \`pull_request\` event from your user, which triggers all checks.\n"
          BODY+="2. **Trigger workflows via CLI:**\n"
          BODY+="\`\`\`bash\n"
          BODY+="gh workflow run swift-build-samples.yml --ref auto/update-linters\n"
          BODY+="gh workflow run swift-lint.yml --ref auto/update-linters\n"
          BODY+="gh workflow run swift-test-package.yml --ref auto/update-linters\n"
          BODY+="\`\`\`\n"

          gh pr create \
            --title "chore: bump Swift linter versions" \
            --body "$(echo -e "$BODY")" \
            --label "dependencies" \
            --head "auto/update-linters" \
            --base "main"
