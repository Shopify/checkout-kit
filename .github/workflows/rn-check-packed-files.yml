name: React Native — Check Packed Files

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# TODO: remove once ShopifyCheckoutKit is published to CocoaPods trunk and
# Maven Central. Tracks the new pod/AAR name introduced by the
# ShopifyCheckoutSheetKit → ShopifyCheckoutKit rename.
env:
  USE_LOCAL_SDK: "1"

jobs:
  check-packed-files:
    name: Check package files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERM: xterm
    defaults:
      run:
        working-directory: platforms/react-native
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js, pnpm, and install dependencies
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/package.json
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native

      - name: Build module and compare snapshot
        run: |
          pnpm module clean
          pnpm module build
          pnpm compare-snapshot
