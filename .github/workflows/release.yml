name: Release package

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release
        required: true
        type: choice
        options:
          - iOS
          - Android
          - React Native
      version:
        description: Expected SDK version. Must match the checked-in SDK version for the selected platform.
        required: true
        type: string
      mode:
        description: Release mode
        required: false
        type: choice
        default: Dry run
        options:
          - Dry run
          - Draft release
          - Production release

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  validate-react-native-release:
    name: Validate React Native release package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Skip React Native publish validation
        if: ${{ inputs.platform != 'React Native' || inputs.mode == 'Dry run' }}
        run: echo "No React Native npm publish validation needed for ${{ inputs.platform }} / ${{ inputs.mode }}."

      - name: Checkout
        if: ${{ inputs.platform == 'React Native' && inputs.mode != 'Dry run' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate requested React Native release
        if: ${{ inputs.platform == 'React Native' && inputs.mode != 'Dry run' }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: .github/scripts/validate-release-version "React Native" "$EXPECTED_VERSION" >/dev/null

      - name: Setup Node.js, pnpm, and install dependencies
        if: ${{ inputs.platform == 'React Native' && inputs.mode != 'Dry run' }}
        uses: ./.github/actions/setup
        with:
          node-version-file: platforms/react-native/package.json
          cache-dependency-path: platforms/react-native/pnpm-lock.yaml
          package-json-file: platforms/react-native/package.json
          working-directory: platforms/react-native
          ignore-scripts: "true"

      - name: Verify React Native version is not already published
        if: ${{ inputs.platform == 'React Native' && inputs.mode != 'Dry run' }}
        working-directory: platforms/react-native
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./modules/@shopify/checkout-kit-react-native/package.json').name")
          VERSION=$(node -p "require('./modules/@shopify/checkout-kit-react-native/package.json').version")
          ENCODED_NAME=$(node -p "encodeURIComponent(require('./modules/@shopify/checkout-kit-react-native/package.json').name)")
          URL="https://registry.npmjs.org/${ENCODED_NAME}/${VERSION}"
          if curl -fs "$URL" > /dev/null; then
            echo "::error::${NAME}@${VERSION} is already published on npm. Bump platforms/react-native/modules/@shopify/checkout-kit-react-native/package.json before creating a GitHub Release."
            exit 1
          fi
          echo "::notice::${NAME}@${VERSION} is not yet on npm — safe to create a release."

      - name: Validate React Native package publish shape
        if: ${{ inputs.platform == 'React Native' && inputs.mode != 'Dry run' }}
        working-directory: platforms/react-native
        env:
          KEEP_TMP: "0"
          PACKAGE_MANAGERS: pnpm
        run: pnpm publish:check:package

      - name: Validate generated React Native consumer app
        if: ${{ inputs.platform == 'React Native' && inputs.mode != 'Dry run' }}
        working-directory: platforms/react-native
        env:
          BUILD_NATIVE: "0"
          KEEP_TMP: "0"
          PACKAGE_MANAGER: pnpm
          PLATFORM: ios
        run: pnpm publish:check:react-native

  release:
    name: Release ${{ inputs.platform }} ${{ inputs.version }}
    needs: validate-react-native-release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate requested release
        id: release
        env:
          PLATFORM: ${{ inputs.platform }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: .github/scripts/validate-release-version "$PLATFORM" "$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Require main branch for stable releases
        if: steps.release.outputs.prerelease == 'false' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Stable releases must be created from the main branch. Current ref: $REF"
          exit 1

      - name: Check tag and release do not already exist
        env:
          TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag '${TAG}' already exists. Refusing to create a duplicate release."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release '${TAG}' already exists."
            exit 1
          fi

          echo "::notice::Tag '${TAG}' and release '${TAG}' do not exist yet."

      - name: Print release plan
        env:
          MODE: ${{ inputs.mode }}
          DISPLAY_PLATFORM: ${{ steps.release.outputs.display_platform }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          PUBLISH_WORKFLOW: ${{ steps.release.outputs.publish_workflow }}
        run: |
          set -euo pipefail
          echo "Release plan:"
          echo "  Platform: ${DISPLAY_PLATFORM}"
          echo "  Version: ${VERSION}"
          echo "  Tag: ${TAG}"
          echo "  Title: ${RELEASE_TITLE}"
          echo "  Prerelease: ${PRERELEASE}"
          echo "  Publish workflow: ${PUBLISH_WORKFLOW}"
          echo "  Mode: ${MODE}"
          if [ "$MODE" = "Dry run" ]; then
            echo "  Release creation: skipped"
            echo "  Publish dispatch: skipped"
          elif [ "$MODE" = "Draft release" ]; then
            echo "  Release creation: draft GitHub Release"
            echo "  Publish dispatch: skipped until the draft release is manually published"
          else
            echo "  Release creation: published GitHub Release"
            echo "  Publish dispatch: ${PUBLISH_WORKFLOW} will be dispatched after release creation"
          fi

      - name: Create GitHub Release
        if: ${{ inputs.mode != 'Dry run' }}
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          DRAFT: ${{ inputs.mode == 'Draft release' && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          args=("$TAG" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --generate-notes)
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          elif [ "$DRAFT" = "false" ]; then
            args+=(--latest)
          fi

          gh release create "${args[@]}"

      - name: Dispatch publish workflow
        if: ${{ inputs.mode == 'Production release' }}
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PUBLISH_WORKFLOW: ${{ steps.release.outputs.publish_workflow }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run "$PUBLISH_WORKFLOW" --ref "$TAG"
          echo "::notice::Dispatched ${PUBLISH_WORKFLOW} at ${TAG}."

      - name: Summary
        env:
          MODE: ${{ inputs.mode }}
          DISPLAY_PLATFORM: ${{ steps.release.outputs.display_platform }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
          PUBLISH_WORKFLOW: ${{ steps.release.outputs.publish_workflow }}
          REF_NAME: ${{ github.ref_name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          WORKFLOW_URL="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release.yml"

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Release plan

          - Mode: \`${MODE}\`
          - Platform: ${DISPLAY_PLATFORM}
          - Version: ${VERSION}
          - Tag: \`${TAG}\`
          - Title: ${RELEASE_TITLE}
          - Publish workflow: \`${PUBLISH_WORKFLOW}\`
          SUMMARY

          if [ "$MODE" = "Dry run" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY

          ## Continue to draft release

          GitHub does not currently support pre-filled \`workflow_dispatch\`
          form inputs via URL. To avoid retyping the validated version, run this
          GitHub CLI command:

          \`\`\`bash
          gh workflow run release.yml \\
            --repo "${GITHUB_REPOSITORY}" \\
            --ref "${REF_NAME}" \\
            -f platform="${PLATFORM}" \\
            -f version="${VERSION}" \\
            -f mode="Draft release"
          \`\`\`

          Or open the [Release package workflow](${WORKFLOW_URL}) and enter the
          same values manually.
          SUMMARY
            echo "::notice::GitHub CLI draft release command written to the job summary."
          fi
