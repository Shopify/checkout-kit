name: Checkout Kit CodeQL

queries:
  - uses: security-extended

paths-ignore:
  - '**/Tests/**'
  - '**/tests/**'
  - '**/test/**'
  - '**/Samples/**'
  - '**/samples/**'
  - '**/sample/**'
