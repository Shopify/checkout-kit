# Shared source-tree filters for workflows that should ignore docs-only changes.
# Negative patterns need `predicate-quantifier: every` in the workflow step that
# reads this file.
android:
  - 'platforms/android/**'
  - &exclude-markdown '!**/*.md'
  - &exclude-docs-directory '!**/docs/**'
swift:
  - 'platforms/swift/**'
  - *exclude-markdown
  - *exclude-docs-directory
reactNative:
  - 'platforms/react-native/**'
  - *exclude-markdown
  - *exclude-docs-directory
web:
  - 'platforms/web/**'
  - *exclude-markdown
  - *exclude-docs-directory
webE2e:
  - 'e2e/web/**'
  - *exclude-markdown
  - *exclude-docs-directory
protocol:
  - 'protocol/**'
  - *exclude-markdown
  - *exclude-docs-directory
protocolTypescript:
  - 'protocol/languages/typescript/**'
  - *exclude-markdown
  - *exclude-docs-directory
