name: Setup Android NDK
description: Resolve, cache, and install the Android NDK version pinned by the React Native Android sample

inputs:
  install-script:
    description: Path to the NDK installer script, relative to the repository root
    required: false
    default: scripts/install_android_ndk

outputs:
  android-sdk-root:
    description: Resolved Android SDK root
    value: ${{ steps.android-sdk.outputs.root }}
  ndk-version:
    description: Resolved Android NDK version
    value: ${{ steps.android-sdk.outputs.ndk_version }}

runs:
  using: composite
  steps:
    - name: Resolve Android SDK inputs
      id: android-sdk
      shell: bash
      env:
        INSTALL_SCRIPT: ${{ inputs.install-script }}
      run: |
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "$sdk_root" ]; then
          echo "ANDROID_HOME or ANDROID_SDK_ROOT must be set" >&2
          exit 1
        fi

        install_script="${GITHUB_WORKSPACE}/${INSTALL_SCRIPT}"
        echo "root=$sdk_root" >> "$GITHUB_OUTPUT"
        echo "ndk_version=$("$install_script" --print-version)" >> "$GITHUB_OUTPUT"

    - name: Cache Android NDK
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.android-sdk.outputs.root }}/ndk/${{ steps.android-sdk.outputs.ndk_version }}
        key: android-ndk-${{ runner.os }}-${{ runner.arch }}-${{ steps.android-sdk.outputs.ndk_version }}

    - name: Install Android NDK
      shell: bash
      env:
        INSTALL_SCRIPT: ${{ inputs.install-script }}
      run: |
        install_script="${GITHUB_WORKSPACE}/${INSTALL_SCRIPT}"
        "$install_script"
