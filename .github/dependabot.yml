version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Android library
  - package-ecosystem: gradle
    directory: "/platforms/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      # Keep Kotlin compiler/plugin updates on 2.x unless the consumer floor is
      # deliberately re-evaluated.
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: [">=3.0.0"]
      # Keep the published stdlib dependency aligned with the Kotlin API/language
      # consumer floor, not the newer compiler used to build the AAR.
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib"
        versions: [">=2.1.0"]
      # Keep kotlinx-serialization on 1.7.x while the library's Kotlin API/language
      # consumer floor is pinned to 2.0.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-json"
        versions: [">=1.8.0"]
      # Keep JUnit on 4.x. JUnit 5 is a test-platform migration
      # (Jupiter/Vintage), not a drop-in update to junit:junit.
      - dependency-name: "junit:junit"
        versions: [">=5.0.0"]

  # Android sample app
  - package-ecosystem: gradle
    directory: "/platforms/android/samples/MobileBuyIntegration"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # The sample includes the Android library as :lib, so library dependencies can
      # appear in this Dependabot scan too.
      # Keep Kotlin compiler/plugin updates on 2.x unless the consumer floor is
      # deliberately re-evaluated.
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: [">=3.0.0"]
      # Keep the published stdlib dependency aligned with the Kotlin API/language
      # consumer floor, not the newer compiler used to build the AAR.
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib"
        versions: [">=2.1.0"]
      # Keep kotlinx-serialization on 1.7.x while the library's Kotlin API/language
      # consumer floor is pinned to 2.0.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-json"
        versions: [">=1.8.0"]
      # Keep JUnit on 4.x. JUnit 5 is a test-platform migration
      # (Jupiter/Vintage), not a drop-in update to junit:junit.
      - dependency-name: "junit:junit"
        versions: [">=5.0.0"]
    groups:
      apollo:
        patterns:
          - "com.apollographql.apollo*"

  # React Native — root pnpm workspace
  - package-ecosystem: npm
    directory: "/platforms/react-native"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # React Native — Checkout Kit module
  - package-ecosystem: npm
    directory: "/platforms/react-native/modules/@shopify/checkout-kit-react-native"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # React Native — sample app
  - package-ecosystem: npm
    directory: "/platforms/react-native/sample"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # React Native — sample iOS CocoaPods (via Bundler/Gemfile)
  - package-ecosystem: bundler
    directory: "/platforms/react-native/sample"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Web — @shopify/checkout-kit
  - package-ecosystem: npm
    directory: "/platforms/web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
