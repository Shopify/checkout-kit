version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # Android library
  - package-ecosystem: gradle
    directory: "/platforms/android"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      # Keep Kotlin on 1.9.x for compatibility
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: [">=2.0.0"]
      # Keep kotlinx-serialization on 1.6.x (compatible with Kotlin 1.9.x)
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-json"
        versions: [">=1.7.0"]
      # Keep Mockito on 4.x (requires JVM 1.8)
      - dependency-name: "org.mockito*:*"
        versions: [">=5.0.0"]
      # Keep JUnit on 4.x (JUnit 5 incompatible with Robolectric)
      - dependency-name: "junit:junit"
        versions: [">=5.0.0"]

  # Android sample app
  - package-ecosystem: gradle
    directory: "/platforms/android/samples/MobileBuyIntegration"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # The sample includes the Android library as :lib, so library dependencies can
      # appear in this Dependabot scan too.
      # Keep Kotlin on 1.9.x for compatibility
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: [">=2.0.0"]
      # Keep kotlinx-serialization on 1.6.x (compatible with Kotlin 1.9.x)
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-json"
        versions: [">=1.7.0"]
      # Keep Mockito on 4.x (requires JVM 1.8)
      - dependency-name: "org.mockito*:*"
        versions: [">=5.0.0"]
      # Keep JUnit on 4.x (JUnit 5 incompatible with Robolectric)
      - dependency-name: "junit:junit"
        versions: [">=5.0.0"]
    groups:
      apollo:
        patterns:
          - "com.apollographql.apollo*"

  # React Native — root pnpm workspace
  - package-ecosystem: npm
    directory: "/platforms/react-native"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # React Native — Checkout Kit module
  - package-ecosystem: npm
    directory: "/platforms/react-native/modules/@shopify/checkout-kit-react-native"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # React Native — sample app
  - package-ecosystem: npm
    directory: "/platforms/react-native/sample"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # React Native — sample iOS CocoaPods (via Bundler/Gemfile)
  - package-ecosystem: bundler
    directory: "/platforms/react-native/sample"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
